    }
    $('setup').innerHTML = '<div class="setup-card"><div class="brand"><h1>紅盤環線</h1><p>台股風格的走格子桌遊</p></div>' +
      '<p class="lede">擲骰繞環線，踩到公司就能買股票。每季一張總經事件讓整個產業一起漲跌，五年後總資產最高的人獲勝。</p>' +
      (g.THREE ? '' : '<p class="lede up">3D 元件沒有載入成功，請確認網路連線後重新整理。</p>') +
      '<div class="field-label">人數</div><div class="seg">' + [2, 3, 4].map(function (n) { return '<button data-act="count" data-n="' + n + '" class="' + (st.n === n ? 'on' : '') + '">' + n + ' 人</button>'; }).join('') + '</div>' +
      '<div class="field-label">玩家（真人可以同一台裝置輪流玩）</div>' + rows +
      '<label class="seed"><span>種子</span><input id="seedInput" maxlength="24" placeholder="留空就隨機；填同一組可以重現牌局" value="' + esc(st.seed) + '"></label>' +
      (RL.net && RL.net.available() ? '<p class="muted">把玩家設成「線上朋友」就能開房間，把連結傳給朋友一起玩。</p>' : '') + '<div class="setup-acts"><button class="btn primary grow" data-act="start">' + (st.players.slice(0, st.n).some(function (p) { return p.kind === 'online'; }) ? '開房間' : '開始遊戲') + '</button><button class="btn" data-act="help">規則</button></div>' + (resume ? '<div class="setup-acts">' + resume + '</div>' : '') + '</div>';
  }
  function showSetup() { $('setup').hidden = false; renderSetup(); }

  // ---------- 線上房間 ----------
  var lobbyState = null; // {mode:'host'|'guest'|'join', room, msg, status, seats, seed}
  function netHandlers() {
    return {
      ready: function () { if (lobbyState) { lobbyState.ready = true; if (!game || $('setup').hidden === false) renderLobbyIfOpen(); } },
      lobby: function (m) { if (lobbyState) { lobbyState.msg = m; renderLobbyIfOpen(); } },
      status: function (s) { if (lobbyState && !$('setup').hidden) { lobbyState.status = s; renderLobby(); } else toast(esc(s)); },
      full: function (m) { if (lobbyState) { lobbyState.status = m.started ? '這個房間已經開打，沒有你的座位。' : '房間滿了。'; lobbyState.dead = true; renderLobby(); } },
      cmds: function () { return game ? game.cmds : []; },
      cmd: function (n, cmd) { if (game && game.net && n >= game.cmds.length) { game.inbox[n] = cmd; pump(); } },
      start: function (m) {
        if (game && game.net && game.seed === String(m.seed)) {
          // 斷線重連：補上漏掉的指令，並把對方沒收到的自己指令重送
          var i;
          for (i = m.cmds.length; i < game.cmds.length; i++) RL.net.sendCmd(i, game.cmds[i]);
          for (i = game.cmds.length; i < m.cmds.length; i++) game.inbox[i] = m.cmds[i];
          pump();
          return;
        }
        try { startGame(m.config, m.seed, m.cmds, { room: RL.net.room, role: 'guest' }); } catch (err) { toast('牌局資料讀取失敗，請重新整理', 'err'); }
      }
    };
  }
  function renderLobbyIfOpen() { if (!$('setup').hidden) renderLobby(); }
  function renderLobby() {
    var L = lobbyState, html = '<div class="setup-card"><div class="brand"><h1>紅盤環線</h1><p>線上房間</p></div>';
    if (L.mode === 'join') {
      html += '<p class="lede">朋友邀你一起玩。輸入你的名字後加入房間。</p><label class="seed"><span>名字</span><input id="joinName" maxlength="8" value="' + esc(L.name || '') + '" placeholder="最多 8 個字"></label>' +
        '<div class="setup-acts"><button class="btn primary grow" data-act="join">加入房間</button><button class="btn" data-act="help">規則</button></div>';
    } else {
      var m = L.msg, seats = m ? m.seats : [];
      if (L.mode === 'host') {
        html += '<p class="lede">把這個連結傳給朋友，他們點開就會加入。</p><div class="linkrow"><input id="roomLink" readonly value="' + esc(RL.net.link(L.room)) + '" aria-label="房間連結"><button class="btn small gold" data-act="copylink">複製</button></div>';
        if (!L.ready) html += '<p class="muted">正在開房間…</p>';
      } else if (!L.dead) html += '<p class="lede">' + (m ? '已加入房間，等房主按開始。' : '正在連到房間…') + '</p>';
      if (seats.length) html += '<div class="field-label">座位</div>';
      seats.forEach(function (s, i) {
        var who = s.kind === 'ai' ? '電腦・' + AI.LABELS[s.style] : s.kind === 'human' ? '房主這邊' : s.taken ? (s.on ? '已加入' : '離線中') : '等朋友加入…';
        html += '<div class="seatrow"><i style="background:' + COLORS[i] + '"></i><b>' + esc(s.kind === 'online' && !s.taken ? '空位' : s.name) + (m.you === i ? '（你）' : '') + '</b><span class="' + (s.kind === 'online' && !s.taken ? 'wait' : '') + '">' + who + '</span></div>';
      });
      if (L.mode === 'host') {
        var open = seats.filter(function (s) { return s.kind === 'online' && !s.taken; }).length;
        html += '<div class="setup-acts"><button class="btn primary grow" data-act="netstart"' + (open || !L.ready ? ' disabled' : '') + '>' + (open ? '還有 ' + open + ' 個空位' : '開始遊戲') + '</button><button class="btn" data-act="netcancel">取消</button></div>';
      }
    }
    if (L.status) html += '<p class="muted" aria-live="polite">' + esc(L.status) + '</p>';
    if (L.dead) html += '<div class="setup-acts"><button class="btn grow" data-act="netcancel">自己開一局</button></div>';
    $('setup').innerHTML = html + '</div>';
    $('setup').hidden = false;
  }
  function openLobby() {
    readSetup();
    var st = ui.setup, used = {}, seats = [];
    for (var i = 0; i < st.n; i++) {
      var p = st.players[i], isAi = p.kind !== 'human' && p.kind !== 'online';
      var name = p.kind === 'online' ? '朋友' : (p.name || '').trim() || (isAi ? AI.NAMES[p.kind] : '玩家 ' + (i + 1));
      if (p.kind === 'human' && name === '你') name = '房主';
      if (p.kind !== 'online') { var base = name, k = 2; while (used[name]) name = base + k++; used[name] = 1; }
      seats.push({ name: name, kind: isAi ? 'ai' : p.kind, style: isAi ? p.kind : null, cid: null });
    }
    lobbyState = { mode: 'host', room: RL.net.newRoom(), seats: seats, seed: (st.seed || '').trim(), msg: null, status: '', ready: false };
    lobbyState.msg = { seats: seats.map(function (s) { return { name: s.name, kind: s.kind, style: s.style, taken: s.kind !== 'online', on: s.kind !== 'online' }; }), you: -1 };
    RL.net.host(lobbyState.room, seats, null, netHandlers());
    renderLobby();
  }
  function netStart() {
    var L = lobbyState, used = {};
    var players = L.seats.map(function (s) {
      var name = s.name, base = name, k = 2;
      while (used[name]) name = base + k++;
      used[name] = 1;
      return s.kind === 'ai' ? { name: name, kind: 'ai', style: s.style } : { name: name, kind: 'human', owner: s.kind === 'online' ? s.cid : RL.net.cid };
    });
    var seed = L.seed || Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36), config = { players: players };
    RL.net.begin(config, seed);
    startGame(config, seed, null, { room: L.room, role: 'host' });
  }
  function resumeHost(sv) {
    var seats = sv.config.players.map(function (p) {
      return p.kind === 'ai' ? { name: p.name, kind: 'ai', style: p.style, cid: null } : p.owner === RL.net.cid ? { name: p.name, kind: 'human', cid: null } : { name: p.name, kind: 'online', cid: p.owner };
    });
    lobbyState = { mode: 'host', room: sv.net.room, seats: seats, msg: null, status: '', ready: false };
    startGame(sv.config, sv.seed, sv.cmds, sv.net);
    RL.net.host(sv.net.room, seats, { config: sv.config, seed: sv.seed }, netHandlers());
    toast('房間已重新開啟，朋友那邊會自動接上');
  }

  function startFromSetup(seedOverride) {
    readSetup();
    var st = ui.setup, used = {}, players = [];
    for (var i = 0; i < st.n; i++) {
      var p = st.players[i], name = (p.name || '').trim() || (p.kind === 'human' ? '玩家 ' + (i + 1) : AI.NAMES[p.kind]);
      var base = name, k = 2;
      while (used[name]) name = base + k++;
      used[name] = 1;
      players.push(p.kind === 'human' ? { name: name, kind: 'human' } : { name: name, kind: 'ai', style: p.kind });
    }
    var seed = seedOverride || (st.seed || '').trim() || Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
    startGame({ players: players }, seed);
  }

  // ---------- 操作 ----------
  function syncViewBtn() { $('btnView').textContent = scene.mode === 'overview' ? '跟隨' : '全覽'; }
  var ACT = {
    view: function () {
      if (scene.mode === 'overview') scene.setMode('follow', game ? scene.pieces[view.turn].userData.cell : 0);
      else scene.setMode('overview');
      syncViewBtn();
    },
    speed: function () {
      ui.speed = SPEEDS[(SPEEDS.indexOf(ui.speed) + 1) % SPEEDS.length];
      scene.speed = ui.speed;
      $('btnSpeed').textContent = ui.speed + '×';
    },
    help: function () { ui.sheet = { type: 'help' }; renderSheetFree(); },
    helptab: function (el) { ui.helpTab = el.dataset.tab; renderSheetFree(); },
    market: function () { openSheet({ type: 'market' }); },
    pickstock: function () { openSheet({ type: 'market', pick: true }); },
    hand: function () { if (ui.me >= 0) openSheet({ type: 'hand' }); },
    log: function () { openSheet({ type: 'log' }); },
    results: function () { openSheet({ type: 'results' }); },
    player: function (el) { openSheet({ type: 'player', pid: +el.dataset.pid }); },
    close: function () { ui.sheet = null; ui.playing = null; renderSheetFree(); },
    'close-bg': function (el, ev) { if (ev.target === el) ACT.close(); },
    modal: function (el) { if (ui.modal) ui.modal(+el.dataset.i); },
    stock: function (el) {
      var cid = +el.dataset.cid;
      if (ui.sheet && ui.sheet.pick) { ui.focusCid = cid; ui.qtyBuy = 1; ui.sheet = null; renderAll(); return; }
      ui.qtyBuy = 1; ui.qtySell = 1;
      openSheet({ type: 'stock', cid: cid });
    },
    qty: function (el) {
      var kind = el.dataset.kind, d = el.dataset.d, key = kind === 'buy' ? 'qtyBuy' : 'qtySell';
      ui[key] = d === 'max' ? 999 : Math.max(1, ui[key] + +d);
      renderPanel(); renderSheet();
    },
    buy: function (el) { var me = myTurn(); if (me >= 0) { var q = ui.qtyBuy; ui.qtyBuy = 1; dispatch({ type: 'BUY', player: me, cid: +el.dataset.cid, qty: q }); } },
    sell: function (el) { var me = myTurn(); if (me >= 0) { var q = ui.qtySell; ui.qtySell = 1; dispatch({ type: 'SELL', player: me, cid: +el.dataset.cid, qty: q }); } },
    roll: function () { var me = myTurn(); if (me >= 0) dispatch({ type: 'ROLL', player: me }); },
    move: function () { var me = myTurn(); if (me >= 0) dispatch({ type: 'MOVE', player: me }); },
    end: function () { var me = myTurn(); if (me >= 0) { ui.sheet = null; dispatch({ type: 'END_TURN', player: me }); } },
    reroll: function () {
      var me = myTurn();
      if (me < 0) return;
      var h = game.state.players[me].hand;
      for (var i = 0; i < h.length; i++) if (h[i].type === 'reroll') { ui.sheet = null; dispatch({ type: 'PLAY_CARD', player: me, uid: h[i].uid }); return; }
    },
    play: function (el) {
      var me = myTurn();
      if (me < 0) return;
      var uid = +el.dataset.uid, p = game.state.players[me], card = null;
      p.hand.forEach(function (c) { if (c.uid === uid) card = c; });
      if (!card) return;
      ui.playing = { uid: uid, type: card.type, sector: null, step: null };
      advancePlay(me);
    },
    sector: function (el) { var me = myTurn(); if (me >= 0 && ui.playing) { ui.playing.sector = el.dataset.sec; advancePlay(me); } },
    replace: function (el) { var me = myTurn(); if (me >= 0 && ui.playing) { ui.playing.replace = el.dataset.type; advancePlay(me); } },
    discard: function (el) { var me = myTurn(); if (me >= 0) dispatch({ type: 'DISCARD', player: me, uid: +el.dataset.uid }); },
    count: function (el) { readSetup(); ui.setup.n = +el.dataset.n; renderSetup(); },
    start: function () {
      if (!g.THREE) return;
      readSetup();
      if (ui.setup.players.slice(0, ui.setup.n).some(function (p) { return p.kind === 'online'; })) openLobby();
      else startFromSetup();
    },
    resume: function () {
      var sv = loadSave();
      if (!sv) return;
      try { if (sv.net) resumeHost(sv); else startGame(sv.config, sv.seed, sv.cmds); } catch (err) { clearSave(); renderSetup(); }
    },
    again: function () {
      if (game && game.net) { clearSave(); g.location.href = g.location.origin + g.location.pathname; return; }
      ui.sheet = null; renderSheetFree(); clearSave(); showSetup();
    },
    join: function () {
      var name = RL.net.clean($('joinName').value);
      try { localStorage.setItem('hongpan-name', name); } catch (err) { /* 略過 */ }
      lobbyState = { mode: 'guest', room: lobbyState.room, name: name, msg: null, status: '連線中…' };
      RL.net.join(lobbyState.room, name, netHandlers());
      renderLobby();
    },
    netstart: function () { netStart(); },
    netcancel: function () { RL.net.close(); lobbyState = null; g.location.href = g.location.origin + g.location.pathname; },
    copylink: function () {
      var el = $('roomLink');
      el.focus(); el.select();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.value).then(function () { toast('連結已複製'); }, function () { toast('請長按或按 Ctrl+C 複製連結'); });
      else toast('請長按或按 Ctrl+C 複製連結');
    },
    sameseed: function () { var cfg = game.config, seed = game.seed; ui.sheet = null; startGame(cfg, seed); }
  };
  function renderSheetFree() {
    // 說明頁在開局前也能開
    if (ui.sheet && ui.sheet.type === 'help') { $('sheetLayer').innerHTML = helpSheet(); $('sheetLayer').dataset.type = 'help'; }
    else if (game) renderSheet();
    else $('sheetLayer').innerHTML = '';
  }
  function advancePlay(me) {
    var pl = ui.playing, p = game.state.players[me], def = D.cards[pl.type];
    if (def.needSector && !pl.sector) { pl.step = 'sector'; renderSheet(); return; }
    if (def.kind === 'lasting' && !E.hasActive(p, pl.type) && p.active.length >= K.activeMax && !pl.replace) { pl.step = 'replace'; renderSheet(); return; }
    ui.playing = null;
    dispatch({ type: 'PLAY_CARD', player: me, uid: pl.uid, sector: pl.sector, replace: pl.replace });
  }

  function onClick(ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACT[el.dataset.act];
    if (fn) fn(el, ev);
  }

  function onPick(cell) {
    if (!game) return;
    var c = D.board[cell];
    if (c.type === 'company') { ui.qtyBuy = 1; ui.qtySell = 1; openSheet({ type: 'stock', cid: c.cid }); }
    else toast('<b>' + c.name + '</b>　' + CELL_TEXT[c.type]);
  }

  function boot(data) {
    document.addEventListener('click', onClick);
    document.addEventListener('change', function (ev) {
      var el = ev.target;
      if (el.id && el.id.indexOf('pkind') === 0) {
        readSetup();
        var i = +el.dataset.i, p = ui.setup.players[i], defaults = ['你', '朋友', '玩家 ' + (i + 1), AI.NAMES.conservative, AI.NAMES.aggressive, AI.NAMES.follower, ''];
        if (defaults.indexOf((p.name || '').trim()) >= 0) p.name = p.kind === 'human' ? (i === 0 ? '你' : '玩家 ' + (i + 1)) : p.kind === 'online' ? '朋友' : AI.NAMES[p.kind];
        renderSetup();
      }
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { if (ui.sheet) ACT.close(); }
    });
    if (!g.THREE) { showSetup(); return; }
    scene = new RL.Scene($('cvwrap'), $('cv'));
    scene.onPick = onPick;
    scene.onMode = syncViewBtn;
    if (document.fonts && document.fonts.load) {
      var txt = D.companies.map(function (c) { return c.name; }).join('') + '結算站策略教室產業快訊券商營業廳茶水間黑天鵝紅盤環線多頭盤整空頭年季第';
      Promise.all([document.fonts.load('700 40px "Noto Sans TC"', txt), document.fonts.load('700 40px "Barlow Semi Condensed"', '0123456789.,%'), document.fonts.load('700 40px "LXGW WenKai TC"', '紅盤環線')])
        .then(function () { scene.redrawLabels(); }).catch(function () { /* 用系統字型 */ });
    }
    var retheme = function () { scene.applyTheme(); };
    if (g.matchMedia) { var mq = g.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', retheme); }
    if (g.MutationObserver) new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    var hot = g.claude && g.claude.hot;
    if (hot && hot.snapshot) hot.snapshot(function () { return game ? { config: game.config, seed: game.seed, cmds: game.cmds } : {}; });
    if (data && data.config && data.cmds) {
      try { startGame(data.config, data.seed, data.cmds); return; } catch (err) { /* 接不上就回到開局畫面 */ }
    }
    var room = RL.net && RL.net.available() ? RL.net.roomFromUrl() : '';
    if (room) {
      var sv = loadSave(), nm = '';
      if (sv && sv.net && sv.net.role === 'host' && sv.net.room === room) { try { resumeHost(sv); return; } catch (err) { clearSave(); } }
      try { nm = localStorage.getItem('hongpan-name') || ''; } catch (err) { /* 略過 */ }
      lobbyState = { mode: 'join', room: room, name: nm, status: '' };
      renderLobby();
      return;
    }
    showSetup();
  }

  RL.app = { boot: boot, get game() { return game; }, dispatch: dispatch };
  var hot0 = g.claude && g.claude.hot;
  function go() { if (hot0 && hot0.ready) hot0.ready(boot); else boot((hot0 && hot0.data) || {}); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
</body>
</html>
