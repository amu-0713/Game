<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>紅盤環線</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：3D 棋盤舞台佔滿上方（電腦版在左），LED 看板式的行情列浮在舞台頂端；
   操作面板在下方（電腦版在右）。色彩取自老公寓磨石子地板與交易所行情看板，紅漲綠跌。 */
:root {
  --bg: #dfe7e1;
  --surface: #fbfbf7;
  --surface-2: #edf1ea;
  --ink: #1c2530;
  --ink-2: #5a6670;
  --line: #c8d2ca;
  --accent: #24459c;
  --accent-ink: #ffffff;
  --gold: #e9a81c;
  --gold-ink: #2e2100;
  --up: #cf3a2e;
  --down: #15834f;
  --up-bg: #fbe5e2;
  --down-bg: #dcf2e7;
  --board: #0d1420;
  --board-ink: #f2c230;
  --board-ink-2: #9fb0c4;
  --shade: rgba(20, 30, 40, 0.42);
  --scene-bg: #d3dfd8;
  --scene-ground: #dde6e0;
  --scene-tile: #f8f7f1;
  --scene-plaza: #eceee6;
  --scene-label: #ffffff;
  --scene-label-ink: #1c2530;
  --scene-speck1: #b9cbc2;
  --scene-speck2: #f6f1e4;
  --scene-speck3: #c2ab98;
  --scene-speck4: #8fa69c;
  --font-display: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-num: "Barlow Semi Condensed", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141c1b; --surface: #1e2827; --surface-2: #283433; --ink: #e9efea; --ink-2: #9db0a9; --line: #384644;
    --accent: #a3bcff; --accent-ink: #0e1a38; --gold: #f2c230; --gold-ink: #2e2100;
    --up: #ff7566; --down: #45d394; --up-bg: #4a2320; --down-bg: #173d2c;
    --board: #0a0f18; --board-ink: #f2c230; --board-ink-2: #8fa0b4; --shade: rgba(0, 0, 0, 0.6);
    --scene-bg: #111918; --scene-ground: #1b2625; --scene-tile: #c5cdc6; --scene-plaza: #2b3836;
    --scene-label: #f6f7f2; --scene-label-ink: #1c2530;
    --scene-speck1: #2b3a37; --scene-speck2: #3c4a45; --scene-speck3: #4a3f37; --scene-speck4: #141c1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141c1b; --surface: #1e2827; --surface-2: #283433; --ink: #e9efea; --ink-2: #9db0a9; --line: #384644;
  --accent: #a3bcff; --accent-ink: #0e1a38; --gold: #f2c230; --gold-ink: #2e2100;
  --up: #ff7566; --down: #45d394; --up-bg: #4a2320; --down-bg: #173d2c;
  --board: #0a0f18; --board-ink: #f2c230; --board-ink-2: #8fa0b4; --shade: rgba(0, 0, 0, 0.6);
  --scene-bg: #111918; --scene-ground: #1b2625; --scene-tile: #c5cdc6; --scene-plaza: #2b3836;
  --scene-label: #f6f7f2; --scene-label-ink: #1c2530;
  --scene-speck1: #2b3a37; --scene-speck2: #3c4a45; --scene-speck3: #4a3f37; --scene-speck4: #141c1b;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; overflow: hidden; overscroll-behavior: none; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.up { color: var(--up); }
.down { color: var(--down); }

#app { height: 100%; display: flex; flex-direction: column; }

/* ---------- 舞台 ---------- */
#stage { flex: 1 1 auto; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--scene-bg); }
#cvwrap { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-num); font-weight: 700; font-size: 15px; padding: 1px 7px; border-radius: 99px; background: var(--surface); box-shadow: 0 2px 8px var(--shade); white-space: nowrap; animation: rise 1.5s ease-out forwards; }
.floater.big { font-size: 18px; padding: 3px 10px; }
@keyframes rise { 0% { opacity: 0; margin-top: 8px; } 12% { opacity: 1; margin-top: 0; } 75% { opacity: 1; } 100% { opacity: 0; margin-top: -42px; } }

#hud { flex: 0 0 auto; background: var(--board); color: var(--board-ink-2); padding-block: 7px 8px; padding-left: var(--gut-l); padding-right: var(--gut-r); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.hud-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; min-width: 0; }
.hud-time { color: #e8eef5; font-weight: 700; white-space: nowrap; }
.lamp { font-weight: 700; white-space: nowrap; }
.lamp::before { content: ""; display: inline-block; width: 0.72em; height: 0.72em; border-radius: 50%; background: currentColor; margin-right: 5px; box-shadow: 0 0 8px currentColor; }
.lamp.bull { color: #ff6b5e; }
.lamp.flat { color: #f2c230; }
.lamp.bear { color: #35c486; }
.hud-index { white-space: nowrap; }
.hud-index b { color: #e8eef5; font-family: var(--font-num); font-size: 17px; font-weight: 700; }
.hud-event { grid-column: 1 / -1; color: var(--board-ink); font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud-event span { color: var(--board-ink-2); }
.hud-btns { display: flex; gap: 6px; }
.hud-btns button { min-width: 40px; height: 34px; padding: 0 9px; border-radius: 8px; border: 1px solid #33415a; color: #e8eef5; font-size: 13px; font-weight: 500; background: #18212f; }
.hud-btns button:hover { background: #223049; }

#toasts { position: absolute; left: var(--gut-l); right: var(--gut-r); bottom: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { max-width: 100%; background: var(--board); color: #eef2f6; padding: 6px 13px; border-radius: 99px; font-size: 13.5px; box-shadow: 0 3px 12px var(--shade); animation: toast 2.6s ease forwards; text-align: center; }
.toast.err { background: var(--up); color: #fff; }
.toast b { color: var(--board-ink); font-weight: 700; }
@keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 8% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- 面板 ---------- */
#side { flex: 0 0 auto; background: var(--surface); border-top: 2px solid var(--ink); display: flex; flex-direction: column; min-height: 0; }
#players { display: flex; gap: 6px; padding-block: 8px 6px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.chip { flex: 1 1 0; min-width: 0; text-align: left; border: 1.5px solid var(--line); border-radius: 9px; padding: 4px 8px 5px; background: var(--surface); display: grid; grid-template-columns: auto 1fr; column-gap: 6px; align-items: center; }
.chip .dot { width: 19px; height: 19px; border-radius: 50%; align-self: center; color: #fff; font-family: var(--font-num); font-weight: 700; font-size: 13px; line-height: 19px; text-align: center; }
.chip .nm { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .tt { grid-column: 1 / -1; font-family: var(--font-num); font-weight: 700; font-size: 16px; line-height: 1.15; white-space: nowrap; }
.chip.on { border-color: var(--ink); background: var(--surface-2); box-shadow: 0 2px 0 var(--ink); }
.chip.on .nm { color: var(--ink); font-weight: 700; }

#feed { display: none; flex: 1 1 0; min-height: 0; overflow: hidden; flex-direction: column; justify-content: flex-end; padding-block: 6px; padding-left: var(--gut-l); padding-right: var(--gut-r); font-size: 13px; color: var(--ink-2); }
#feed div { padding: 3px 0; border-bottom: 1px solid var(--line); }
#feed .q { font-weight: 700; color: var(--ink); border: 0; padding-top: 8px; }
#panel { padding-block: 4px 12px; padding-left: var(--gut-l); padding-right: var(--gut-r); display: flex; flex-direction: column; gap: 9px; }
#ctx { min-height: 96px; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.ctx-title { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.25; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 9px; }
.ctx-title small { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--ink-2); }
.ctx-text { color: var(--ink-2); font-size: 14px; }
.ctx-text b { color: var(--ink); }
.kv { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13.5px; color: var(--ink-2); }
.kv b { color: var(--ink); font-family: var(--font-num); font-size: 15.5px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 5px; line-height: 1.6; white-space: nowrap; font-family: var(--font-body); }
.tag.cheap { background: var(--down-bg); color: var(--down); }
.tag.pricey { background: var(--up-bg); color: var(--up); }
.tag.fair { background: var(--surface-2); color: var(--ink-2); }
.tag.sec { color: #fff; }

.trade { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--ink); border-radius: 9px; overflow: hidden; background: var(--surface); }
.stepper button { width: 40px; height: 40px; font-size: 20px; font-weight: 700; }
.stepper button:hover { background: var(--surface-2); }
.stepper output { min-width: 46px; text-align: center; font-family: var(--font-num); font-weight: 700; font-size: 18px; }
.stepper .max { width: auto; padding: 0 10px; font-size: 13px; border-left: 1.5px solid var(--ink); }

#acts { display: flex; gap: 7px; align-items: stretch; }
.btn { min-height: 44px; padding: 0 13px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--surface); font-weight: 700; font-size: 14.5px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 3px 0 var(--ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: var(--gold-ink); }
.btn.sell { border-color: var(--down); color: var(--down); }
.btn.buy { background: var(--up); border-color: var(--up); color: #fff; }
.btn.small { min-height: 36px; padding: 0 10px; font-size: 13.5px; border-radius: 8px; }
.btn.grow { flex: 1 1 auto; }
.btn[disabled] { opacity: 0.4; cursor: default; box-shadow: none; }
.btn .n { font-family: var(--font-num); background: var(--ink); color: var(--surface); border-radius: 99px; min-width: 20px; padding: 0 5px; font-size: 13px; line-height: 20px; }
#mainBtn { flex: 1 1 auto; font-size: 17px; font-family: var(--font-display); }

/* ---------- 抽屜與對話框 ---------- */
.overlay { position: fixed; inset: 0; background: var(--shade); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.tdot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; }
#sheetLayer .overlay { z-index: 50; }
#modalLayer .overlay { z-index: 60; }
.overlay.center { align-items: center; padding: 16px var(--gut-r) 16px var(--gut-l); }
.sheet { width: 100%; max-width: 640px; max-height: 88%; background: var(--surface); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; gap: 10px; padding-block: 12px 8px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 21px; flex: 1 1 auto; text-wrap: balance; }
.sheet-body { overflow-y: auto; padding-block: 0 18px; padding-left: var(--gut-l); padding-right: var(--gut-r); min-height: 0; -webkit-overflow-scrolling: touch; }
.x { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--ink); font-size: 18px; font-weight: 700; flex: 0 0 auto; }
.x:hover { background: var(--surface-2); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs button { padding: 6px 13px; border-radius: 99px; border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; }
.tabs button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.sec-head { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; font-weight: 700; font-size: 14px; }
.sec-head i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sec-head span { font-weight: 500; color: var(--ink-2); font-size: 12.5px; }
.stock { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 58px 58px 46px; gap: 6px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.stock:hover { background: var(--surface-2); }
.stock .nm { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-weight: 700; }
.stock .nm small { font-weight: 400; color: var(--ink-2); font-size: 12px; }
.stock .r { text-align: right; font-family: var(--font-num); font-weight: 600; font-size: 16px; }
.stock .own { text-align: right; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.stock .own b { font-family: var(--font-num); font-size: 15px; color: var(--ink); }
.stock-cols { display: grid; grid-template-columns: minmax(0, 1fr) 58px 58px 46px; gap: 6px; padding: 0 6px; font-size: 12px; color: var(--ink-2); text-align: right; }
.stock-cols span:first-child { text-align: left; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.facts div { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--ink-2); }
.facts b { display: block; font-family: var(--font-num); font-size: 18px; color: var(--ink); line-height: 1.25; }
.facts b.up, .kv b.up { color: var(--up); }
.facts b.down, .kv b.down { color: var(--down); }
.block { border-top: 1px solid var(--line); padding: 12px 0; display: flex; flex-direction: column; gap: 8px; }
.block h3 { margin: 0; font-size: 14px; }
.muted { color: var(--ink-2); font-size: 13.5px; }
.holders { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; }
.holders i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }

.card { border: 1.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; margin-bottom: 9px; box-shadow: 0 3px 0 var(--ink); }
.card.active { background: var(--surface-2); box-shadow: none; border-color: var(--line); }
.card-top { display: flex; align-items: baseline; gap: 8px; }
.card-top b { font-family: var(--font-display); font-size: 18px; }
.card-top small { color: var(--ink-2); font-size: 12.5px; }
.card-top .left { margin-left: auto; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.card p { margin: 0; font-size: 14px; }
.card-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }

.log { font-size: 13.5px; display: flex; flex-direction: column; }
.log div { padding: 4px 0; border-bottom: 1px solid var(--line); }
.log .q { font-weight: 700; background: var(--surface-2); padding: 4px 8px; border-radius: 6px; border: 0; margin-top: 8px; }

.event { width: 100%; max-width: 380px; background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: 16px 18px 14px; box-shadow: 0 6px 0 var(--ink); display: flex; flex-direction: column; gap: 8px; animation: pop 0.22s ease-out; }
.event.swan { background: var(--board); color: #eef2f6; border-color: #000; }
.event.swan .ctx-text { color: #b5c1d0; }
@keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }
.kicker { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; color: var(--ink-2); }
.event.swan .kicker { color: var(--board-ink); }
.event h2 { margin: 0; font-family: var(--font-display); font-size: 27px; line-height: 1.2; text-wrap: balance; }
.fx { display: flex; flex-wrap: wrap; gap: 6px; }
.fx span { font-family: var(--font-num); font-weight: 700; font-size: 15px; padding: 1px 9px; border-radius: 6px; }
.fx .u { background: var(--up-bg); color: var(--up); }
.fx .d { background: var(--down-bg); color: var(--down); }
.event .hint { font-size: 12px; color: var(--ink-2); text-align: right; }
.event.swan .hint { color: #8fa0b4; }
.rank { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; font-size: 15px; }
.rank .no { font-family: var(--font-num); font-weight: 700; font-size: 18px; width: 22px; }
.rank .who { display: flex; align-items: center; gap: 7px; min-width: 0; font-weight: 700; }
.rank .who i { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
.rank .who small { font-weight: 400; color: var(--ink-2); }
.rank .amt { font-family: var(--font-num); font-weight: 700; font-size: 18px; text-align: right; }
.rank .sub { grid-column: 2 / 4; font-size: 12.5px; color: var(--ink-2); margin-top: -6px; }

/* ---------- 開局 ---------- */
#setup { position: fixed; inset: 0; z-index: 40; background: var(--shade); display: flex; align-items: center; justify-content: center; padding: 16px var(--gut-r) 16px var(--gut-l); overflow-y: auto; }
.setup-card { width: 100%; max-width: 440px; background: var(--surface); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 0 7px 0 var(--ink); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; margin: auto; }
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.brand h1 { white-space: nowrap; margin: 0; font-family: var(--font-display); font-size: 40px; line-height: 1; color: var(--up); letter-spacing: 0.02em; }
.brand p { margin: 0 0 3px; color: var(--ink-2); font-size: 13.5px; }
.lede { margin: 0; font-size: 14.5px; }
.seg { display: flex; border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1 1 0; height: 40px; font-weight: 700; }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button.on { background: var(--ink); color: var(--surface); }
.prow { display: grid; grid-template-columns: 14px minmax(0, 1fr) minmax(0, 1.15fr); gap: 8px; align-items: center; }
.prow i { width: 14px; height: 14px; border-radius: 50%; }
.prow input, .prow select, .seed input { height: 40px; border: 1.5px solid var(--line); border-radius: 9px; padding: 0 9px; background: var(--surface); width: 100%; min-width: 0; }
.seed { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.setup-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.linkrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.linkrow input { height: 40px; border: 1.5px solid var(--line); border-radius: 9px; padding: 0 9px; background: var(--surface-2); min-width: 0; font-size: 13px; }
.seatrow { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.seatrow i { width: 14px; height: 14px; border-radius: 50%; }
.seatrow span { font-size: 13px; color: var(--ink-2); }
.seatrow span.wait { color: var(--gold); font-weight: 700; }
.field-label { font-size: 12.5px; font-weight: 700; color: var(--ink-2); letter-spacing: 0.08em; margin-bottom: -6px; }

/* ---------- 規則內文 ---------- */
.prose { font-size: 14.5px; max-width: 62ch; }
.prose h3 { font-family: var(--font-display); font-size: 18px; margin: 18px 0 4px; }
.prose p, .prose ul, .prose ol { margin: 6px 0; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin: 3px 0; }
.tbl { overflow-x: auto; margin: 8px 0; }
.tbl table { border-collapse: collapse; font-size: 13.5px; min-width: 100%; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 5px 9px 5px 0; text-align: left; vertical-align: top; }
.tbl th { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.tbl td.n { font-family: var(--font-num); font-weight: 600; white-space: nowrap; }

.chart { width: 100%; height: auto; display: block; }

/* ---------- 電腦版 ---------- */
@media (min-width: 900px) {
  #app { flex-direction: row; }
  #side { width: 400px; border-top: 0; border-left: 2px solid var(--ink); }
  #players { flex-direction: column; padding-top: 14px; }
  .chip { flex: 0 0 auto; grid-template-columns: auto 1fr auto; padding: 8px 12px; }
  .chip .dot { grid-row: auto; }
  .chip .tt { grid-column: auto; }
  .chip .nm { font-size: 14.5px; }
  .chip .tt { font-size: 19px; }
  #panel { flex: 0 0 auto; padding-bottom: 18px; padding-top: 10px; border-top: 1px solid var(--line); }
  #ctx { min-height: 150px; justify-content: flex-end; }
  #acts { flex-wrap: wrap; }
  #mainBtn { flex: 1 1 100%; order: -1; min-height: 52px; }
  .overlay { align-items: center; }
  .sheet { border-radius: 16px; border: 2px solid var(--ink); max-height: 84%; }
  #feed { display: flex; }
}
@media (max-width: 380px) {
  .chip .tt { font-size: 14.5px; }
  .btn { padding: 0 10px; font-size: 14px; }
}
@media (max-height: 620px) and (max-width: 899px) {
  #ctx { min-height: 78px; }
  .ctx-title { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .event { animation: none; }
  .floater { animation: none; }
}
</style>

<template id="tplRules">
  <h3>目標</h3>
  <p>每人 100 萬起家，玩 5 年共 20 季。最後現金加上持股市值最高的人獲勝。</p>

  <h3>一季怎麼進行</h3>
  <ol>
    <li><b>開盤</b>：翻一張總經事件，相關產業一起漲跌；每家公司再各自小幅波動；接著亮出本季的景氣燈號。</li>
    <li><b>每人行動一次</b>：擲兩顆骰子前進，執行停留格子的效果。擲骰前後都可以賣股票、出策略卡。</li>
    <li><b>收盤</b>：結算策略卡的季末效果，生效中的卡剩餘季數減一。</li>
  </ol>
  <p>先手每季輪流。時間只看「季」，走得快只會多經過幾次結算站，不會比別人多行動。</p>

  <h3>景氣燈號</h3>
  <ul>
    <li><b class="up">多頭季</b>：大盤比上一季漲超過 2.5%。</li>
    <li><b class="down">空頭季</b>：大盤比上一季跌超過 2.5%。</li>
    <li><b>盤整季</b>：其他情況。</li>
  </ul>
  <p>台股習慣紅色代表漲、綠色代表跌，遊戲裡也一樣。</p>

  <h3>格子</h3>
  <ul>
    <li><b>公司</b>（24 格）：可以用當下股價買進這家公司，每次最多 10 張。</li>
    <li><b>結算站</b>：經過或停留都會領股息、抽一張策略卡、拿 3 萬繞圈獎金。</li>
    <li><b>策略教室</b>：抽一張策略卡。</li>
    <li><b>產業快訊</b>：抽一張快訊，可能讓某個產業或某檔股票漲跌，也可能是你個人的收支。</li>
    <li><b>券商營業廳</b>：可以買進任一家公司，最多 10 張。</li>
    <li><b>茶水間</b>：領 1 萬零用金。</li>
    <li><b>黑天鵝</b>：翻開一張全市場大事件，所有人同時受影響。</li>
  </ul>

  <h3>買賣股票</h3>
  <ul>
    <li>股價單位是元，一張的價錢是股價乘以 1,000。股價 50 元，一張就是 5 萬。</li>
    <li>買：踩到公司格、券商營業廳，或用「遠端下單」卡才能買。不收手續費。</li>
    <li>賣：輪到自己時隨時可賣，收成交金額 1% 的交易成本。</li>
    <li>同一檔股票所有人都能買，沒有獨佔。</li>
    <li>每檔股票會標示「便宜」「合理」「偏貴」，代表現在的股價相對它的體質貴不貴。便宜的股票長期比較容易漲回來。</li>
    <li>題材餘溫：這一季總經事件的影響，下一季還會有大約三成的餘波。市場行情裡會顯示每個產業的餘溫。</li>
  </ul>

  <h3>股息</h3>
  <p>經過結算站時，每張持股依那家公司的固定股息發現金。金融、傳產股息高但波動小，半導體、生技的成長股幾乎沒有股息。</p>

  <h3>大股東</h3>
  <p>某家公司持股最多、而且至少 3 張的人是大股東（平手時原本的大股東保留）。別的玩家踩到這家公司時，大股東二選一：</p>
  <ul>
    <li><b>領人氣紅利</b>：向銀行領 1 萬。</li>
    <li><b>開法說會</b>：擲一顆骰，1～2 點股價跌 6%，3～6 點股價漲 8%。</li>
  </ul>
  <p>踩到的人不用付錢，照常可以買股票。</p>

  <h3>策略卡</h3>
  <ul>
    <li>手牌上限 5 張，超過要先出卡或棄卡才能結束回合。</li>
    <li>持續型的卡出牌後生效 4 季，同時最多 3 張生效。已滿時出新卡要換掉一張；同名卡重出會重新計時。</li>
    <li>即時型的卡用完就丟。</li>
  </ul>
  <p>每張卡的效果請看「公司與卡片」分頁。</p>

  <h3>電腦對手</h3>
  <ul>
    <li><b>保守型</b>：偏好低波動、高股息的股票，保留兩成現金，空頭時更小心。</li>
    <li><b>激進型</b>：偏好高波動的股票，幾乎滿倉，追剛有利多的產業，當上大股東一定開法說會。</li>
    <li><b>跟風型</b>：買剛有利多的產業，也買別人持有多的股票。</li>
  </ul>

  <h3>和朋友連線玩</h3>
  <ul>
    <li>在一般網站版本的開局畫面，把玩家類型設成「線上朋友」再按「開房間」，會得到一個房間連結。</li>
    <li>把連結傳給朋友，他點開、輸入名字就會加入。所有空位都有人後，房主按「開始遊戲」。</li>
    <li>每個人只看得到自己的手牌，輪到自己才能操作。電腦對手和同機真人可以混在同一局。</li>
    <li>斷線或重新整理後，再開同一個連結會接回原本的座位。房主重新整理後按「接續上一局」。</li>
    <li>在 Claude 的 Artifact 頁面上不能連線，只能單機或同一台裝置輪流玩。</li>
  </ul>

  <h3>操作提示</h3>
  <ul>
    <li>點棋盤上的公司可以看詳細資料，點上方的玩家可以看他的持股與生效中的卡。</li>
    <li>拖曳可以移動棋盤，雙指或滾輪可以縮放；右上角可以切換「全覽」與「跟隨」。</li>
    <li>進度會自動存在這台裝置的瀏覽器裡，重新整理後可以從開局畫面接續。</li>
  </ul>
</template>

<template id="tplBalance">
  <p>規則層可以在沒有畫面的情況下跑完整局。每一版都用電腦對手自動對打，每輪約 5,000 局，檢查卡死、數值極端、座位公平、產業與卡片強度，再調整數值。以下是四版的紀錄。</p>

  <h3>檢查項目與最終結果</h3>
  <div class="tbl"><table>
    <tr><th>項目</th><th>最終結果</th></tr>
    <tr><td>卡死與不合法指令</td><td>360 局混合對局全數跑完，每一步都檢查現金、持股、股價為合法整數</td></tr>
    <tr><td>種子重現</td><td>抽 90 局，用同一組種子與指令重播，結果完全一致</td></tr>
    <tr><td>三人局風格勝率</td><td>保守 35.0%／激進 36.7%／跟風 28.3%</td></tr>
    <tr><td>四人局風格勝率</td><td>保守 22.9%／激進 24.8%／跟風 27.3%</td></tr>
    <tr><td>座位勝率（三位同風格）</td><td>33.3%／32.8%／33.9%</td></tr>
    <tr><td>只買單一產業的勝率</td><td>六個產業介於 20.4%～28.9%（公平值 25%）</td></tr>
    <tr><td>策略卡每次出牌帶來的現金</td><td>持續型九張介於 1.4 萬～3.3 萬</td></tr>
    <tr><td>無腦策略</td><td>全程只留現金勝率 0%；能買就買勝率 20.8%，低於三種正式風格</td></tr>
    <tr><td>數值範圍</td><td>股價 12.2～183.8 元；期末大盤 8,609～14,934 點；平均期末資產約 160 萬</td></tr>
  </table></div>

  <h3>第 1 版：初版數值</h3>
  <ul>
    <li>產業嚴重失衡：只買傳產勝率 42.2%，只買半導體 7.1%。原因是總經事件裡半導體常當受害者，傳產常受惠。</li>
    <li>策略卡強弱差太多：每次出牌的價值從董事席位 0.4 萬到存股紀律 3.4 萬。</li>
    <li>空頭季只佔 14%，現金避險、逆勢抄底很少發動。</li>
  </ul>

  <h3>第 2 版：重排事件與卡片數值</h3>
  <ul>
    <li>重新分配總經事件的受惠與受害產業，並把一張「風平浪靜」換成「電子旺季」。</li>
    <li>黑天鵝從 6 張增加到 8 張（新增貿易戰開打、藥害醜聞），讓每個產業都有機會中槍。</li>
    <li>景氣燈號門檻從 3% 改為 2.5%；便宜與偏貴的標示門檻從 15% 改為 10%。</li>
    <li>高股息：多領一半改為加倍。價值投資：九折改為八五折。現金避險：4% 改為 8%。產業輪動：多賺一半改為多賺一倍。存股紀律：1 萬改為 8 千。董事席位：紅利兩倍改為三倍，並讓法說會一定上漲。</li>
    <li>結果：產業勝率收斂到 16.1%～33.9%，卡片價值收斂到 1.2 萬～3.4 萬。</li>
  </ul>

  <h3>第 3 版：產業成長率與題材餘溫</h3>
  <ul>
    <li>半導體與觀光被黑天鵝打得最重，把它們的長期成長率調高（每季 2.1%），其他產業每季 1.4%～1.7%。風險高的產業成長也高。</li>
    <li>加入「題材餘溫」：總經事件有三成餘波延續到下一季。這讓「跟著新聞買」變成可行的打法，跟風型電腦才有立足點。</li>
    <li>強勢動能獎金從 2.5% 微調為 2.2%。</li>
    <li>結果：產業勝率 20.9%～28.3%。但激進型在三人局勝率 51.7%，而且發現一號座位有優勢（37.8%）。</li>
  </ul>

  <h3>第 4 版：座位與電腦風格</h3>
  <ul>
    <li>先手原本固定，試過每年輪替與每季輪替，用每種 1,500 局比較後採用每季輪替，三人局座位勝率回到 33% 上下。</li>
    <li>電腦參數：保守型現金保留從 25% 降到 20%；激進型從 3% 提高到 6%；跟風型改為看題材餘溫與別人的持股，不再追單季漲幅，也不在下跌後殺出。</li>
    <li>結果就是上面表格的最終數字。</li>
  </ul>

  <h3>已知限制</h3>
  <ul>
    <li>董事席位平均價值最低（1.4 萬），它需要先當上大股東，屬於看局面的卡。</li>
    <li>遠端下單與加班趕路的價值無法直接用現金衡量，沒有列入卡片比較。</li>
    <li>平衡是用三種電腦風格測出來的。真人可能找到電腦沒試過的打法，例如空頭前全部換成現金搭配現金避險；這類打法在模擬裡沒有被驗證。</li>
  </ul>
</template>

<script>
/* 紅盤環線 — 可設定種子的亂數（mulberry32）。狀態存在遊戲狀態裡，方便重現與同步。 */
(function (g) {
  'use strict';
  var RL = (g.RL = g.RL || {});

  function hash(seed) {
    var s = String(seed), h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // st 是任何帶有 rng（uint32）欄位的物件
  function next(st) {
    st.rng = (st.rng + 0x6d2b79f5) >>> 0;
    var t = st.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function int(st, n) {
    return Math.floor(next(st) * n);
  }

  function shuffle(st, arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = int(st, i + 1);
      var t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }

  RL.rng = { hash: hash, next: next, int: int, shuffle: shuffle };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<script>
/* 紅盤環線 — 規則層。不碰畫面：createGame 建立狀態，applyCommand 處理指令並回傳事件紀錄。
   同一組種子 + 同一串指令 = 完全相同的一局。 */
(function (g) {
  'use strict';
  var RL = (g.RL = g.RL || {});
  var D = RL.data, K = D.K, R = RL.rng;
  var NC = D.companies.length, NB = D.board.length;

  // ---------- 小工具 ----------
  function clampPrice(x) { return Math.max(K.minPrice, Math.min(K.maxPrice, Math.round(x))); }
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function lotValue(s, cid) { return s.prices[cid] * 100; }
  function holdingsValue(s, pid) {
    var p = s.players[pid], v = 0;
    for (var i = 0; i < NC; i++) if (p.holdings[i]) v += p.holdings[i] * s.prices[i] * 100;
    return v;
  }
  function total(s, pid) { return s.players[pid].cash + holdingsValue(s, pid); }
  function marketIndex(s) {
    var a = 0;
    for (var i = 0; i < NC; i++) a += s.prices[i];
    return Math.round((a / s.sum0) * 10000);
  }
  function tag(s, cid) {
    var r = s.prices[cid] / s.fair[cid];
    return r < K.cheap ? 'cheap' : r > K.pricey ? 'pricey' : 'fair';
  }
  function hasActive(p, type) {
    for (var i = 0; i < p.active.length; i++) if (p.active[i].type === type) return p.active[i];
    return null;
  }
  function fxPct(card, c) {
    var v = card.sectors && card.sectors[c.sector] !== undefined ? card.sectors[c.sector] : card.all || 0;
    if (card.hv && c.vol === 'H') v += card.hv;
    return v / 100;
  }
  function actor(s) {
    if (s.phase === 'over') return -1;
    return s.phase === 'major' ? s.pending.major : s.turn;
  }
  function addCash(s, pid, amt, why, ev) {
    var p = s.players[pid];
    if (amt < 0 && p.cash + amt < 0) amt = -p.cash;
    if (!amt) return 0;
    p.cash += amt;
    ev.push({ t: 'cash', p: pid, amt: amt, why: why });
    return amt;
  }
  function cardStat(s, type, amt) {
    var st = s.stats.cards[type] || (s.stats.cards[type] = { plays: 0, gain: 0 });
    st.gain += amt;
  }

  // ---------- 牌堆 ----------
  function drawCard(s, pid, ev) {
    if (!s.cardDeck.length) {
      if (!s.cardDiscard.length) return;
      s.cardDeck = R.shuffle(s, s.cardDiscard);
      s.cardDiscard = [];
    }
    var type = s.cardDeck.pop();
    var c = { uid: s.uid++, type: type };
    s.players[pid].hand.push(c);
    ev.push({ t: 'draw', p: pid, card: type, uid: c.uid });
  }
  function drawFrom(s, key, n) {
    if (!s[key].length) {
      var arr = [];
      for (var i = 0; i < n; i++) arr.push(i);
      s[key] = R.shuffle(s, arr);
    }
    return s[key].pop();
  }

  // ---------- 股價 ----------
  // pct：長度 NC 的陣列（小數）。事件造成的漲跌會觸發低波動、產業輪動卡。
  function applyEvent(s, pct, cause, ev) {
    var changes = [], i;
    for (i = 0; i < NC; i++) {
      if (!pct[i]) continue;
      var from = s.prices[i], to = clampPrice(from * (1 + pct[i]));
      s.fair[i] *= 1 + pct[i] * K.fairShare;
      if (to !== from) {
        s.prices[i] = to;
        changes.push({ cid: i, from: from, to: to });
      }
    }
    if (!changes.length) return;
    ev.push({ t: 'prices', cause: cause, changes: changes });
    if (cause === 'briefing') return;
    for (var pid = 0; pid < s.players.length; pid++) {
      var p = s.players[pid];
      var low = hasActive(p, 'lowvol'), rot = hasActive(p, 'rotate');
      if (!low && !rot) continue;
      var loss = 0, gain = 0;
      for (i = 0; i < changes.length; i++) {
        var ch = changes[i], n = p.holdings[ch.cid];
        if (!n) continue;
        var d = (ch.to - ch.from) * 100 * n;
        if (d < 0) loss -= d;
        else if (rot && D.companies[ch.cid].sector === rot.sector) gain += d;
      }
      if (low && loss > 0) {
        var a = Math.round(loss * K.lowvolComp);
        p.cash += a;
        cardStat(s, 'lowvol', a);
        ev.push({ t: 'cardfx', p: pid, card: 'lowvol', amt: a });
      }
      if (rot && gain > 0) {
        var b = Math.round(gain * K.rotateBonus);
        p.cash += b;
        cardStat(s, 'rotate', b);
        ev.push({ t: 'cardfx', p: pid, card: 'rotate', amt: b, sector: rot.sector });
      }
    }
  }

  function updateMajor(s, cid, ev) {
    var max = 0, who = [], i;
    for (i = 0; i < s.players.length; i++) {
      var n = s.players[i].holdings[cid];
      if (n > max) { max = n; who = [i]; }
      else if (n === max && n > 0) who.push(i);
    }
    var cur = s.major[cid], next = -1;
    if (max >= K.majorMin) {
      if (who.length === 1) next = who[0];
      else if (who.indexOf(cur) >= 0) next = cur;
    }
    if (next !== cur) {
      s.major[cid] = next;
      ev.push({ t: 'major_change', cid: cid, from: cur, to: next });
    }
  }

  // ---------- 季的開始與結束 ----------
  function startQuarter(s, ev) {
    s.quarter++;
    var n = s.players.length, i;
    s.first = (K.rotateFirst === 'quarter' ? s.quarter - 1 : K.rotateFirst === 'year' ? Math.floor((s.quarter - 1) / 4) : 0) % n;
    s.order = 0;
    s.turn = s.first;
    for (i = 0; i < n; i++) s.players[i].sold = false;
    s.prevClose = s.prices.slice();
    ev.push({ t: 'quarter', q: s.quarter, year: Math.ceil(s.quarter / 4), season: ((s.quarter - 1) % 4) + 1, first: s.first });

    var m = D.macro[s.macroDeck[s.quarter - 1]];
    s.macro = m.id;
    ev.push({ t: 'macro', id: m.id });
    var pct = [];
    for (i = 0; i < NC; i++) pct.push(fxPct(m, D.companies[i]));
    applyEvent(s, pct, 'macro', ev);

    // 開盤波動：題材餘溫 + 個股隨機 + 向合理價靠攏；合理價長期成長
    var changes = [];
    for (i = 0; i < NC; i++) {
      var c = D.companies[i], from = s.prices[i];
      var tr = s.trend[c.sector] || 0;
      var noise = (R.next(s) + R.next(s) - 1) * K.vol[c.vol];
      var rev = clamp(K.rev * (s.fair[i] / from - 1), -K.revClamp, K.revClamp);
      var to = clampPrice(from * (1 + tr + noise + rev));
      s.fair[i] *= (1 + K.growth[c.sector]) * (1 + tr * K.fairShare);
      if (to !== from) { s.prices[i] = to; changes.push({ cid: i, from: from, to: to }); }
    }
    if (changes.length) ev.push({ t: 'prices', cause: 'open', changes: changes });
    for (i = 0; i < D.sectors.length; i++) {
      var sid = D.sectors[i].id;
      var sp = m.sectors && m.sectors[sid] !== undefined ? m.sectors[sid] : m.all || 0;
      s.trend[sid] = (sp / 100) * K.carry;
    }

    var idx = marketIndex(s), last = s.indexHist[s.indexHist.length - 1];
    var chg = idx / last - 1;
    s.regime = chg > K.regimeTh ? 'bull' : chg < -K.regimeTh ? 'bear' : 'flat';
    s.indexHist.push(idx);
    s.stats.regimes[s.regime]++;
    ev.push({ t: 'regime', regime: s.regime, from: last, to: idx });

    beginTurn(s, ev);
  }

  function beginTurn(s, ev) {
    s.phase = 'pre';
    s.pending = null;
    s.ctx = { dice: null, allow: [], rolled: false };
    ev.push({ t: 'turn', p: s.turn });
  }

  function endQuarter(s, ev) {
    var i, j;
    ev.push({ t: 'qend', q: s.quarter });
    for (i = 0; i < s.players.length; i++) {
      var p = s.players[i], a;
      if (s.regime === 'bull' && hasActive(p, 'momentum')) {
        a = Math.round(holdingsValue(s, i) * K.momentumPct);
        if (a > 0) { p.cash += a; cardStat(s, 'momentum', a); ev.push({ t: 'cardfx', p: i, card: 'momentum', amt: a }); }
      }
      if (s.regime === 'bear' && hasActive(p, 'hedge')) {
        a = Math.round(p.cash * K.hedgePct);
        if (a > 0) { p.cash += a; cardStat(s, 'hedge', a); ev.push({ t: 'cardfx', p: i, card: 'hedge', amt: a }); }
      }
      if (hasActive(p, 'discipline') && !p.sold && holdingsValue(s, i) > 0) {
        a = K.disciplineAmt;
        p.cash += a; cardStat(s, 'discipline', a); ev.push({ t: 'cardfx', p: i, card: 'discipline', amt: a });
      }
      for (j = p.active.length - 1; j >= 0; j--) {
        if (--p.active[j].left <= 0) {
          ev.push({ t: 'expire', p: i, card: p.active[j].type });
          s.cardDiscard.push(p.active[j].type);
          p.active.splice(j, 1);
        }
      }
      p.history.push(total(s, i));
    }
    if (s.quarter % 4 === 0 && s.quarter < s.quarters) ev.push({ t: 'year', year: s.quarter / 4, ranking: ranking(s) });
    if (s.quarter >= s.quarters) {
      s.phase = 'over';
      s.result = ranking(s);
      ev.push({ t: 'over', ranking: s.result });
    } else {
      startQuarter(s, ev);
    }
  }

  function ranking(s) {
    var r = s.players.map(function (p, i) { return { p: i, total: total(s, i), cash: p.cash }; });
    r.sort(function (a, b) { return b.total - a.total || b.cash - a.cash || a.p - b.p; });
    return r;
  }

  // ---------- 移動與格子 ----------
  function settle(s, pid, ev) {
    var p = s.players[pid], div = 0;
    for (var i = 0; i < NC; i++) if (p.holdings[i]) div += p.holdings[i] * D.companies[i].div;
    var extra = 0;
    if (div > 0 && hasActive(p, 'highdiv')) {
      extra = Math.round(div * (K.highdivMult - 1));
      cardStat(s, 'highdiv', extra);
    }
    p.laps++;
    p.cash += div + extra + K.lapBonus;
    s.stats.dividends += div + extra;
    ev.push({ t: 'settle', p: pid, div: div, extra: extra, bonus: K.lapBonus });

<script>

  P.drawScreen = function () {
    var cv = this.screenCanvas, c = cv.getContext('2d'), st = this.state;
    c.fillStyle = '#0d1420';
    c.fillRect(0, 0, cv.width, cv.height);
    c.textBaseline = 'middle';
    if (!st) {
      c.fillStyle = '#f2c230';
      c.textAlign = 'center';
      c.font = '700 84px "LXGW WenKai TC",' + FONT;
      c.fillText('紅盤環線', cv.width / 2, 150);
      c.fillStyle = '#9fb0c4';
      c.font = '500 30px ' + FONT;
      c.fillText('五年二十季・比誰資產高', cv.width / 2, 240);
      this.screenTex.needsUpdate = true;
      return;
    }
    var hist = st.indexHist.slice(), idx = hist[hist.length - 1], prev = hist.length > 1 ? hist[hist.length - 2] : idx;
    if (this.shown) { var sum = 0; for (var q = 0; q < this.shown.length; q++) sum += this.shown[q]; idx = Math.round((sum / st.sum0) * 10000); hist[hist.length - 1] = idx; }
    var reg = { bull: ['多頭', UP], flat: ['盤整', '#f2c230'], bear: ['空頭', '#35c486'] }[st.regime];
    c.textAlign = 'left';
    c.fillStyle = '#9fb0c4';
    c.font = '500 28px ' + FONT;
    c.fillText('第 ' + Math.ceil(st.quarter / 4) + ' 年 第 ' + (((st.quarter - 1) % 4) + 1) + ' 季', 28, 40);
    c.textAlign = 'right';
    c.fillStyle = reg[1];
    c.font = '700 34px ' + FONT;
    c.fillText('● ' + reg[0], cv.width - 28, 40);
    c.textAlign = 'left';
    c.fillStyle = '#f2c230';
    c.font = '700 46px ' + FONT;
    var m = st.macro >= 0 ? D.macro[st.macro].name : '';
    c.fillText(m, 28, 104);
    var up = idx >= prev;
    c.fillStyle = idx === prev ? '#e8eef5' : up ? '#ff6b5e' : '#35c486';
    c.font = '700 70px ' + NUM;
    c.fillText(idx.toLocaleString('en-US'), 28, 186);
    c.font = '600 34px ' + NUM;
    var w = c.measureText('00,000').width;
    c.font = '600 32px ' + NUM;
    c.fillText((up ? '▲ ' : '▼ ') + Math.abs((idx / prev - 1) * 100).toFixed(1) + '%', 28, 244);
    // 走勢線
    var x0 = 300, x1 = cv.width - 28, y0 = 150, y1 = 320, lo = 1e9, hi = 0, i;
    for (i = 0; i < hist.length; i++) { lo = Math.min(lo, hist[i]); hi = Math.max(hi, hist[i]); }
    if (hi - lo < 400) { var mid = (hi + lo) / 2; lo = mid - 200; hi = mid + 200; }
    c.strokeStyle = '#263247';
    c.lineWidth = 2;
    for (i = 0; i <= 2; i++) { c.beginPath(); c.moveTo(x0, y0 + ((y1 - y0) * i) / 2); c.lineTo(x1, y0 + ((y1 - y0) * i) / 2); c.stroke(); }
    c.strokeStyle = '#f2c230';
    c.lineWidth = 5;
    c.lineJoin = 'round';
    c.beginPath();
    var px = 0, py = 0;
    for (i = 0; i < hist.length; i++) {
      px = x0 + ((x1 - x0) * i) / 20; py = y1 - ((hist[i] - lo) / (hi - lo)) * (y1 - y0);
      if (i) c.lineTo(px, py); else c.moveTo(px, py);
    }
    c.stroke();
    c.fillStyle = '#f2c230';
    c.beginPath(); c.arc(px, py, 8, 0, 6.283); c.fill();
    void w;
    this.screenTex.needsUpdate = true;
    this.lampMat.color = hex(st.regime === 'bull' ? '#ff5a48' : st.regime === 'bear' ? '#2fd08a' : '#f2c230');
    this.dirty = true;
  };

  // ---------- 骰子 ----------
  var DICE_ROT = { 1: [0, 0], 6: [Math.PI, 0], 2: [0, Math.PI / 2], 5: [0, -Math.PI / 2], 3: [-Math.PI / 2, 0], 4: [Math.PI / 2, 0] };
  P.buildDice = function () {
    var faces = [2, 5, 1, 6, 3, 4], mats = faces.map(function (n) {
      var cv = document.createElement('canvas');
      cv.width = cv.height = 96;
      var c = cv.getContext('2d');
      c.fillStyle = '#fffdf6';
      c.fillRect(0, 0, 96, 96);
      c.fillStyle = n === 1 || n === 4 ? '#e04a3c' : '#1c2530';
      var pts = { 1: [[48, 48]], 2: [[26, 26], [70, 70]], 3: [[24, 24], [48, 48], [72, 72]], 4: [[27, 27], [69, 27], [27, 69], [69, 69]], 5: [[25, 25], [71, 25], [48, 48], [25, 71], [71, 71]], 6: [[27, 22], [69, 22], [27, 48], [69, 48], [27, 74], [69, 74]] }[n];
      pts.forEach(function (p) { c.beginPath(); c.arc(p[0], p[1], n === 1 ? 14 : 9, 0, 6.283); c.fill(); });
      var t = new THREE.CanvasTexture(cv);
      t.encoding = THREE.sRGBEncoding;
      return new THREE.MeshLambertMaterial({ map: t });
    });
    this.dice = [];
    var fx = Math.cos(this.azimuth), fz = Math.sin(this.azimuth);
    for (var i = 0; i < 2; i++) {
      var d = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mats);
      var side = i ? 0.45 : -0.45;
      d.userData.home = { x: fx * 1.5 - fz * side, z: fz * 1.5 + fx * side };
      d.position.set(d.userData.home.x, 0.36, d.userData.home.z);
      d.castShadow = true;
      d.visible = false;
      this.scene.add(d);
      this.dice.push(d);
    }
  };

  P.rollDice = function (a, b) {
    var self = this, vals = [a, b];
    return Promise.all(this.dice.map(function (d, i) {
      var fin = DICE_ROT[vals[i]], sx = (i ? 3 : 2) * Math.PI * 2, sz = (i ? 2 : 3) * Math.PI * 2;
      d.visible = true;
      return self.tween(850, function (t) {
        var e = 1 - Math.pow(1 - t, 3);
        d.rotation.set(fin[0] + sx * (1 - e), 5 * (1 - e), fin[1] + sz * (1 - e));
        d.position.y = 0.36 + Math.abs(Math.sin(t * Math.PI * 2.5)) * 1.6 * (1 - t);
      });
    }));
  };

    $('players').innerHTML = s.players.map(function (p, i) {

        '<span class="dot" style="background:' + COLORS[i] + '">' + (i + 1) + '</span><span class="nm">' + esc(p.name) + '</span><span class="tt num">' + wan1(vTotal(i)) + '</span></button>';
    }).join('');
  }

  function isLocal(i) { return !game.net || game.config.players[i].owner === RL.net.cid; }
  function myTurn() {
    if (!game || ui.busy) return -1;
    var a = E.actor(game.state);
    return a >= 0 && game.state.players[a].kind === 'human' && isLocal(a) ? a : -1;
  }

  function stepperHtml(kind, qty) {
    return '<span class="stepper"><button data-act="qty" data-kind="' + kind + '" data-d="-1" aria-label="減少">−</button><output class="num">' + qty + '</output>' +
      '<button data-act="qty" data-kind="' + kind + '" data-d="1" aria-label="增加">＋</button><button class="max" data-act="qty" data-kind="' + kind + '" data-d="max">最多</button></span>';
  }
  function buyHtml(cid, me) {
    var s = game.state, max = E.maxBuy(s, me, cid), unit = E.unitCost(s, me, cid), full = E.lotValue(s, cid);
    if (E.allowance(s, cid) <= 0) return '';
    if (max <= 0) return '<div class="ctx-text">現金不夠買一張（一張 ' + wan(unit) + '）。</div>';
    ui.qtyBuy = Math.max(1, Math.min(max, ui.qtyBuy));
    return '<div class="trade">' + stepperHtml('buy', ui.qtyBuy) +
      '<button class="btn buy grow" data-act="buy" data-cid="' + cid + '">買進 ' + ui.qtyBuy + ' 張・' + wan(unit * ui.qtyBuy) + '</button></div>' +
      (unit < full ? '<div class="ctx-text">策略卡折扣中：一張原價 ' + wan(full) + '，你只要 <b>' + wan(unit) + '</b>。</div>' : '');
  }
  function sellHtml(cid, me) {
    var s = game.state, have = s.players[me].holdings[cid];
    if (have <= 0) return '';
    ui.qtySell = Math.max(1, Math.min(have, ui.qtySell));
    var gain = Math.round(E.lotValue(s, cid) * ui.qtySell * (1 - K.sellFee));
    return '<div class="trade">' + stepperHtml('sell', ui.qtySell) +
      '<button class="btn sell grow" data-act="sell" data-cid="' + cid + '">賣出 ' + ui.qtySell + ' 張・拿回 ' + wan(gain) + '</button></div>';
  }
  function companyLine(cid) {
    var s = game.state, c = D.companies[cid], t = E.tag(s, cid);
    return '<div class="ctx-title">' + c.name + ' ' + secTag(c.sector) + ' <span class="tag ' + t + '">' + TAG_TEXT[t] + '</span></div>' +
      '<div class="kv"><span>股價 <b class="' + cls(s.prevClose[cid], s.prices[cid]) + '">' + px(s.prices[cid]) + '</b></span><span>本季 <b class="' + cls(s.prevClose[cid], s.prices[cid]) + '">' + pctStr(s.prevClose[cid], s.prices[cid]) + '</b></span>' +
      '<span>一張 <b>' + wan(E.lotValue(s, cid)) + '</b></span><span>股息 <b>' + c.div.toLocaleString('en-US') + '</b></span></div>';
  }
  function anyAllowance(s) {
    if (!s.ctx) return false;
    for (var i = 0; i < s.ctx.allow.length; i++) if (s.ctx.allow[i].any && s.ctx.allow[i].cid === -1 && s.ctx.allow[i].left > 0) return true;
    return false;
  }
  function focusCompany(s) {
    if (ui.focusCid >= 0 && E.allowance(s, ui.focusCid) > 0) return ui.focusCid;
    for (var i = 0; i < NC; i++) if (E.allowance(s, i) > 0 && !anyAllowance(s)) return i;
    if (s.ctx) for (var k = 0; k < s.ctx.allow.length; k++) if (!s.ctx.allow[k].any && s.ctx.allow[k].left > 0) return s.ctx.allow[k].cid;
    return -1;
  }

  function renderPanel() {
    if (!game) return;
    var s = game.state, me = myTurn(), ctx = '', main = { label: '請稍候', act: '', dis: true };
    var cur = s.phase === 'over' ? -1 : E.actor(s);
    if (s.phase === 'over') {
      ctx = '<div class="ctx-title">五年結束</div><div class="ctx-text">最後總資產最高的人獲勝。</div>';
      main = { label: '看結算', act: 'results', dis: false };
    } else if (me < 0) {
      var p = s.players[cur];
      ctx = '<div class="ctx-title">' + (p.kind === 'ai' ? esc(p.name) + ' 行動中' : '等 ' + esc(p.name) + ' 操作') + ' <small>' + (p.kind === 'ai' ? '電腦・' + (AI.LABELS[p.style] || '') : '線上玩家') + '</small></div><div class="ctx-text">可以趁這時候看看市場和自己的手牌。</div>';
    } else if (s.phase === 'pre') {
      ctx = '<div class="ctx-title">' + pname(me) + ' 的回合 <small>現金 ' + wan(s.players[me].cash) + '</small></div>';
      var fc0 = focusCompany(s);
      if (fc0 >= 0) ctx += companyLine(fc0) + buyHtml(fc0, me);
      else if (anyAllowance(s)) ctx += '<div class="ctx-text">遠端下單生效中：可以買進任一家公司。</div><div class="trade"><button class="btn small" data-act="pickstock">選一家公司</button></div>';
      else ctx += '<div class="ctx-text">擲骰前可以先賣股票或出策略卡。</div>';
      main = { label: '擲骰子', act: 'roll', dis: false };
    } else if (s.phase === 'rolled') {
      var d = s.ctx.dice, to = (s.players[me].pos + d[0] + d[1]) % D.board.length, cell = D.board[to];
      ctx = '<div class="ctx-title">擲出 ' + d[0] + ' ＋ ' + d[1] + '</div><div class="ctx-text">會走到「<b>' + (cell.type === 'company' ? cname(cell.cid) : cell.name) + '</b>」。你手上有「加班趕路」，不滿意可以重擲一次。</div>' +
        '<div class="trade"><button class="btn small gold" data-act="reroll">用「加班趕路」重擲</button></div>';
      main = { label: '前進 ' + (d[0] + d[1]) + ' 步', act: 'move', dis: false };
    } else if (s.phase === 'major') {
      ctx = '<div class="ctx-title">等待大股東決定</div>';
    } else if (s.phase === 'act') {
      var here = D.board[s.players[me].pos], fc = focusCompany(s);
      if (fc >= 0) {
        ctx = companyLine(fc) + buyHtml(fc, me);
        if (!E.allowance(s, fc)) ctx += '<div class="ctx-text">這回合已經買滿。</div>';
      } else if (anyAllowance(s)) {
        ctx = '<div class="ctx-title">' + (here.type === 'broker' ? '券商營業廳' : '遠端下單') + '</div><div class="ctx-text">可以買進任一家公司，最多 10 張。</div><div class="trade"><button class="btn small" data-act="pickstock">選一家公司</button></div>';
      } else if (here.type === 'company') {
        ctx = companyLine(here.cid) + '<div class="ctx-text">這回合已經買滿，或已經買過了。</div>';
      } else {
        ctx = '<div class="ctx-title">' + here.name + '</div><div class="ctx-text">' + CELL_TEXT[here.type] + '</div>';
      }
      if (s.players[me].hand.length > K.handMax) ctx += '<div class="ctx-text up">手牌超過 ' + K.handMax + ' 張，要先出卡或棄卡才能結束回合。</div>';
      main = { label: '結束回合', act: 'end', dis: false };
    }
    $('ctx').innerHTML = ctx;
    var hand = ui.me >= 0 ? s.players[ui.me].hand.length : 0;
    $('acts').innerHTML = '<button class="btn" data-act="market">市場</button>' +
      '<button class="btn" data-act="hand"' + (ui.me < 0 ? ' disabled' : '') + '>手牌 <span class="n">' + hand + '</span></button>' +
      '<button class="btn" data-act="log">紀錄</button>' +
      '<button class="btn primary" id="mainBtn" data-act="' + main.act + '"' + (main.dis ? ' disabled' : '') + '>' + main.label + '</button>';
  }

  // ---------- 抽屜 ----------
  function sheetWrap(title, body) {
    return '<div class="overlay" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>' + title + '</h2><button class="x" data-act="close" aria-label="關閉">✕</button></div><div class="sheet-body">' + body + '</div></div></div>';
  }
  function renderSheet() {
    var sh = ui.sheet, el = $('sheetLayer');
    if (!sh) { el.innerHTML = ''; return; }
    var keep = el.querySelector('.sheet-body'), top = keep && el.dataset.type === sh.type ? keep.scrollTop : 0;
    var html = '';
    if (sh.type === 'market') html = marketSheet(sh);
    else if (sh.type === 'stock') html = stockSheet(sh.cid);
    else if (sh.type === 'hand') html = handSheet();
    else if (sh.type === 'player') html = playerSheet(sh.pid);
    else if (sh.type === 'log') html = logSheet();
    else if (sh.type === 'help') html = helpSheet();
    else if (sh.type === 'results') html = resultsSheet();
    el.innerHTML = html;
    el.dataset.type = sh.type;
    var body = el.querySelector('.sheet-body');
    if (body) body.scrollTop = sh.type === 'log' && !top ? body.scrollHeight : top;
  }
  function openSheet(sh) { ui.sheet = sh; ui.playing = null; renderSheet(); }

  function marketSheet(sh) {
    var s = game.state, who = ui.me >= 0 ? ui.me : -1, html = '';
    if (sh.pick) html += '<p class="muted">選一家要買的公司。</p>';
    html += '<div class="stock-cols"><span>公司</span><span>股價</span><span>本季</span><span>持股</span></div>';
    D.sectors.forEach(function (sec) {
      var tr = s.trend[sec.id] || 0;
      html += '<div class="sec-head"><i style="background:' + sec.color + '"></i>' + sec.name + (tr ? ' <span>題材餘溫：下季約 ' + (tr > 0 ? '+' : '−') + Math.abs(tr * 100).toFixed(1) + '%</span>' : '') + '</div>';
      D.companies.forEach(function (c) {
        if (c.sector !== sec.id) return;
        var t = E.tag(s, c.id), own = who >= 0 ? s.players[who].holdings[c.id] : 0, k = cls(s.prevClose[c.id], s.prices[c.id]);
        html += '<button class="stock" data-act="stock" data-cid="' + c.id + '"><span class="nm">' + c.name + ' <span class="tag ' + t + '">' + TAG_TEXT[t] + '</span>' + (s.major[c.id] >= 0 ? '<small>大股東 ' + pname(s.major[c.id]) + '</small>' : '') + '</span>' +
          '<span class="r ' + k + '">' + px(s.prices[c.id]) + '</span><span class="r ' + k + '">' + pctStr(s.prevClose[c.id], s.prices[c.id]) + '</span><span class="own">' + (own ? '<b>' + own + '</b> 張' : '—') + '</span></button>';
      });
    });
    return sheetWrap(sh.pick ? '選股票' : '市場行情', html);
  }

  function stockSheet(cid) {
    var s = game.state, c = D.companies[cid], t = E.tag(s, cid), me = myTurn(), who = ui.me;
    var k = cls(s.prevClose[cid], s.prices[cid]), yld = (c.div / (s.prices[cid] * 100)) * 100;
    var html = '<div class="kv" style="margin-bottom:8px">' + secTag(c.sector) + ' <span class="tag ' + t + '">' + TAG_TEXT[t] + '</span><span>' + c.role + '</span></div>' +
      '<div class="facts"><div>股價<b class="' + k + '">' + px(s.prices[cid]) + ' 元</b></div><div>本季漲跌<b class="' + k + '">' + pctStr(s.prevClose[cid], s.prices[cid]) + '</b></div>' +
      '<div>一張要<b>' + wan(E.lotValue(s, cid)) + '</b></div><div>波動<b>' + VOL_TEXT[c.vol] + '</b></div>' +
      '<div>每張股息<b>' + c.div.toLocaleString('en-US') + ' 元</b></div><div>殖利率約<b>' + yld.toFixed(1) + '%</b></div></div>';
    var holders = s.players.map(function (p, i) { return p.holdings[cid] ? '<span>' + dot(i) + esc(p.name) + ' <b class="num">' + p.holdings[cid] + '</b> 張' + (s.major[cid] === i ? '（大股東）' : '') + '</span>' : ''; }).join('');
    html += '<div class="block"><h3>誰持有</h3><div class="holders">' + (holders || '<span class="muted">目前沒有人持有。至少 3 張且最多的人會成為大股東。</span>') + '</div></div>';
    if (who >= 0 && s.players[who].holdings[cid]) {
      var have = s.players[who].holdings[cid], cost = s.players[who].costBasis[cid], val = have * E.lotValue(s, cid);
      html += '<div class="block"><h3>' + pname(who) + ' 的持股</h3><div class="kv"><span>持有 <b>' + have + '</b> 張</span><span>市值 <b>' + wan(val) + '</b></span><span>損益 <b class="' + cls(cost, val) + '">' + signed(val - cost) + '</b></span></div>' +
        (me === who && (s.phase === 'pre' || s.phase === 'act') ? sellHtml(cid, me) + '<div class="muted">賣出會扣 1% 交易成本。</div>' : '<div class="muted">輪到你的時候才能賣出。</div>') + '</div>';
    }
    if (me >= 0 && (s.phase === 'pre' || s.phase === 'act') && E.allowance(s, cid) > 0) html += '<div class="block"><h3>買進</h3>' + buyHtml(cid, me) + '</div>';
    else html += '<div class="block"><div class="muted">踩到這家公司的格子（或券商營業廳）才能買進。</div></div>';
    return sheetWrap(c.name, html);
  }

  function handSheet() {
    var s = game.state, who = ui.me, p = s.players[who], me = myTurn() === who, html = '';
    var canPlay = me && (s.phase === 'pre' || s.phase === 'act');
    html += '<div class="sec-head">生效中 <span>最多 ' + K.activeMax + ' 張，每張持續 ' + K.cardDur + ' 季</span></div>';
    if (!p.active.length) html += '<p class="muted">還沒有生效中的策略卡。</p>';
    p.active.forEach(function (a) {
      html += '<div class="card active"><div class="card-top"><b>' + cardName(a.type) + '</b>' + (a.sector ? secTag(a.sector) : '') + '<span class="left">還剩 ' + a.left + ' 季</span></div><p>' + D.cards[a.type].text + '</p></div>';
    });
    html += '<div class="sec-head">手牌 <span>' + p.hand.length + ' / ' + K.handMax + ' 張</span></div>';
    if (!p.hand.length) html += '<p class="muted">手上沒有卡。經過結算站或停在策略教室可以抽卡。</p>';
    p.hand.forEach(function (c) {
      var def = D.cards[c.type], acts = '', pl = ui.playing && ui.playing.uid === c.uid ? ui.playing : null;
      if (pl && pl.step === 'sector') {
        acts = '<div class="muted">選一個產業：</div><div class="pick">' + D.sectors.map(function (x) { return '<button class="btn small" style="border-color:' + x.color + '" data-act="sector" data-sec="' + x.id + '">' + x.name + '</button>'; }).join('') + '</div>';
      } else if (pl && pl.step === 'replace') {
        acts = '<div class="muted">生效中的卡已滿，要換掉哪一張？</div><div class="pick">' + p.active.map(function (a) { return '<button class="btn small" data-act="replace" data-type="' + a.type + '">' + cardName(a.type) + '（剩 ' + a.left + ' 季）</button>'; }).join('') + '</div>';
      } else if (c.type === 'reroll') {
        acts = me && s.phase === 'rolled' ? '<button class="btn small gold" data-act="reroll">重擲骰子</button>' : '<span class="muted">擲骰後、移動前才能用。</span>';
      } else if (canPlay) {
        acts = '<button class="btn small gold" data-act="play" data-uid="' + c.uid + '">出牌</button>';
      } else acts = '<span class="muted">輪到你、還沒結束回合時可以出牌。</span>';
      if (canPlay) acts += ' <button class="btn small" data-act="discard" data-uid="' + c.uid + '">棄掉</button>';
      html += '<div class="card"><div class="card-top"><b>' + def.name + '</b><small>' + (def.kind === 'lasting' ? '持續 ' + K.cardDur + ' 季' : '用完即丟') + '</small></div><p>' + def.text + '</p><div class="card-acts">' + acts + '</div></div>';
    });
    return sheetWrap(pname(who) + ' 的策略卡', html);
  }

  function playerSheet(pid) {
    var s = game.state, p = s.players[pid], hv = E.holdingsValue(s, pid), html = '';
    html += '<div class="facts"><div>總資產<b>' + wan1(E.total(s, pid)) + '</b></div><div>現金<b>' + wan1(p.cash) + '</b></div><div>持股市值<b>' + wan1(hv) + '</b></div><div>繞圈<b>' + p.laps + ' 次</b></div></div>';
    html += '<div class="block"><h3>生效中的策略卡</h3>' + (p.active.length ? '<div class="holders">' + p.active.map(function (a) { return '<span><b>' + cardName(a.type) + '</b>' + (a.sector ? '・' + D.sectorById(a.sector).name : '') + '（剩 ' + a.left + ' 季）</span>'; }).join('') + '</div>' : '<div class="muted">沒有。</div>') + '<div class="muted">手牌 ' + p.hand.length + ' 張</div></div>';
    var rows = '';
    D.companies.forEach(function (c) {
      if (!p.holdings[c.id]) return;
      var val = p.holdings[c.id] * E.lotValue(s, c.id);
      rows += '<button class="stock" data-act="stock" data-cid="' + c.id + '"><span class="nm">' + c.name + (s.major[c.id] === pid ? ' <small>大股東</small>' : '') + '</span><span class="r">' + px(s.prices[c.id]) + '</span><span class="r">' + (val / 10000).toFixed(1) + '</span><span class="own"><b>' + p.holdings[c.id] + '</b> 張</span></button>';
    });
    html += '<div class="block"><h3>持股</h3>' + (rows ? '<div class="stock-cols"><span>公司</span><span>股價</span><span>市值(萬)</span><span>持股</span></div>' + rows : '<div class="muted">還沒有持股。</div>') + '</div>';
    return sheetWrap('<i class="tdot" style="background:' + COLORS[pid] + '"></i>' + esc(p.name) + (p.kind === 'ai' ? ' <small class="muted">電腦・' + AI.LABELS[p.style] + '</small>' : ''), html);
  }

  function logSheet() {
    return sheetWrap('對局紀錄', '<div class="log">' + (ui.log.map(function (l) { return '<div' + (l.q ? ' class="q"' : '') + '>' + l.html + '</div>'; }).join('') || '<p class="muted">還沒有紀錄。</p>') + '</div>');
  }

  function helpSheet() {
    var tabs = '<div class="tabs"><button class="' + (ui.helpTab === 'rules' ? 'on' : '') + '" data-act="helptab" data-tab="rules">怎麼玩</button><button class="' + (ui.helpTab === 'data' ? 'on' : '') + '" data-act="helptab" data-tab="data">公司與卡片</button><button class="' + (ui.helpTab === 'balance' ? 'on' : '') + '" data-act="helptab" data-tab="balance">平衡調整紀錄</button></div>';
    var body = ui.helpTab === 'data' ? dataTables() : $(ui.helpTab === 'rules' ? 'tplRules' : 'tplBalance').innerHTML;
    return sheetWrap('規則說明', tabs + '<div class="prose">' + body + '</div>');
  }

  function dataTables() {
    var h = '<h3>公司</h3><div class="tbl"><table><tr><th>產業</th><th>公司</th><th>開局股價</th><th>波動</th><th>每張股息</th><th>定位</th></tr>';
    D.companies.forEach(function (c) { h += '<tr><td>' + D.sectorById(c.sector).name + '</td><td>' + c.name + '</td><td class="n">' + px(c.price0) + '</td><td>' + VOL_TEXT[c.vol] + '</td><td class="n">' + c.div.toLocaleString('en-US') + '</td><td>' + c.role + '</td></tr>'; });
    h += '</table></div><h3>策略卡</h3><div class="tbl"><table><tr><th>卡名</th><th>張數</th><th>類型</th><th>效果</th></tr>';
    Object.keys(D.cards).forEach(function (k) { var c = D.cards[k]; h += '<tr><td>' + c.name + '</td><td class="n">' + c.count + '</td><td>' + (c.kind === 'lasting' ? '持續' : '即時') + '</td><td>' + c.text + '</td></tr>'; });
    h += '</table></div><h3>總經事件（每季一張）</h3><div class="tbl"><table><tr><th>事件</th><th>影響</th></tr>';
    D.macro.forEach(function (m) { h += '<tr><td>' + m.name + '</td><td>' + (fxText(fxList(m)) || '無影響') + '</td></tr>'; });
    h += '</table></div><h3>黑天鵝</h3><div class="tbl"><table><tr><th>事件</th><th>影響</th></tr>';
    D.swans.forEach(function (m) { h += '<tr><td>' + m.name + '</td><td>' + fxText(fxList(m)) + '</td></tr>'; });
    h += '</table></div><h3>產業快訊</h3><div class="tbl"><table><tr><th>事件</th><th>影響</th></tr>';
    var seen = {};
    D.news.forEach(function (m) { if (seen[m.name]) return; seen[m.name] = 1; h += '<tr><td>' + m.name + '</td><td>' + newsText(m, null) + '</td></tr>'; });
    return h + '</table></div>';
  }
  function newsText(nw, e) {
    var sg = function (v) { return (v >= 0 ? '+' : '−') + Math.abs(v) + '%'; };
    if (nw.kind === 'sector') return (e && e.sector ? D.sectorById(e.sector).name : '隨機一個產業') + '全體 ' + sg(nw.pct);
    if (nw.kind === 'myTop') return (e ? (e.cid >= 0 ? cname(e.cid) : '你沒有持股，沒有影響') : '你持股最多的那一檔') + (e && !(e.cid >= 0) ? '' : ' ' + sg(nw.pct));
    if (nw.kind === 'cheapest') return (e && e.cid >= 0 ? cname(e.cid) : '目前最便宜的一檔') + ' ' + sg(nw.pct);
    if (nw.kind === 'priciest') return (e && e.cid >= 0 ? cname(e.cid) : '目前最貴的一檔') + ' ' + sg(nw.pct);
    return '現金 ' + signed(nw.amt);
  }

  function chartSvg() {
    var s = game.state, W = 560, H = 230, L = 46, R = 12, T = 12, B = 26, lo = 1e12, hi = 0, n = s.quarters;
    s.players.forEach(function (p) { p.history.forEach(function (v) { lo = Math.min(lo, v); hi = Math.max(hi, v); }); });
    lo = Math.floor(lo / 200000) * 200000; hi = Math.ceil(hi / 200000) * 200000;
    if (hi === lo) hi = lo + 200000;
    var X = function (i) { return L + ((W - L - R) * i) / n; }, Y = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
    var g2 = '', step = (hi - lo) / 4, i;
    for (i = 0; i <= 4; i++) {
      var v = lo + step * i;
      g2 += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="12" fill="var(--ink-2)">' + Math.round(v / 10000) + '萬</text>';
    }
    for (i = 0; i <= n; i += 4) g2 += '<text x="' + X(i) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="12" fill="var(--ink-2)">' + (i === 0 ? '開局' : '第' + i / 4 + '年') + '</text>';
    s.players.forEach(function (p, k) {
      var d = p.history.map(function (v, j) { return (j ? 'L' : 'M') + X(j).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');
      var last = p.history.length - 1;
      g2 += '<path d="' + d + '" fill="none" stroke="' + COLORS[k] + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + X(last) + '" cy="' + Y(p.history[last]) + '" r="4.5" fill="' + COLORS[k] + '"/>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="各玩家每季總資產走勢">' + g2 + '</svg>';
  }

  function playEvents(events) {
    var chain = Promise.resolve();

  // ---------- 流程 ----------
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ config: game.config, seed: game.seed, cmds: game.cmds, net: game.net || null })); } catch (err) { /* 無法存檔時照常進行 */ }
  }
  function loadSave() {
    try { var d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return d && d.config && d.cmds ? d : null; } catch (err) { return null; }
  }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (err) { /* 略過 */ } }

  // 線上對戰：別人的指令先放進信箱，等這邊動畫播完、輪到那個人時再套用
  function pump() {
    if (!game || !game.net || !ui.waiting) return;
    var n = game.cmds.length, cmd = game.inbox[n];
    if (!cmd) return;
    delete game.inbox[n];
    ui.waiting = false;
    dispatch(cmd, true);
  }
  function dispatch(cmd, remote) {
    var token = game;
    var r = E.applyCommand(game.state, cmd);
    if (!r.ok) { toast(remote ? '和其他人的牌局不同步了，請重新整理頁面' : esc(r.error), 'err'); return; }
    game.cmds.push(cmd);
    if (game.net && !remote && game.state.players[cmd.player].kind === 'human') RL.net.sendCmd(game.cmds.length - 1, cmd);
    save();
    ui.busy = true;
    renderPanel(); renderSheet();
    playEvents(r.events).then(function () { if (token === game) step(); });
  }

  function step() {
    var s = game.state, token = game;
    if (s.phase === 'over') {
      ui.busy = false;
      scene.markTurn(-1);
      renderAll();
      openSheet({ type: 'results' });
      return;
    }
    var a = E.actor(s), p = s.players[a];
    if (p.kind === 'ai') {
      ui.busy = true;
      renderAll();
      scene.wait(380).then(function () { if (token === game) dispatch(AI.next(s)); });
      return;
    }
    if (!isLocal(a)) {
      ui.busy = false;
      ui.waiting = true;
      renderAll();
      pump();
      return;
    }
    ui.busy = false;
    if (s.phase === 'major') {
      var pd = s.pending, need = ui.humans > 1 && ui.me !== a;
      renderAll();
      showCard({
        kicker: (need ? '請 ' + esc(p.name) + ' 決定・' : '') + '你是大股東',
        title: pname(pd.lander) + ' 踩到你的「' + cname(pd.cid) + '」',
        html: '<div class="ctx-text">領紅利：向銀行領 ' + wan(K.majorBonus * (E.hasActive(p, 'seat') ? K.seatMult : 1)) + '。<br>開法說會：擲一顆骰，1～2 點股價跌 6%，3～6 點漲 8%' + (E.hasActive(p, 'seat') ? '（你有董事席位，一定是漲）' : '') + '。你持有 ' + p.holdings[pd.cid] + ' 張。</div>',
        buttons: [{ label: '領紅利', value: 'bonus', cls: 'gold' }, { label: '開法說會', value: 'briefing' }]
      }).then(function (v) { if (token === game) dispatch({ type: 'MAJOR_CHOICE', player: a, choice: v }); });
      return;
    }
    ui.me = a;
    renderAll();
  }

  function startGame(config, seed, cmds, net) {
    var gme = E.createGame(config, seed);
    game = { config: config, seed: String(seed), state: gme.state, cmds: [], net: net || null, inbox: {} };
    ui.waiting = false;
    ui.log = []; ui.sheet = null; ui.playing = null; ui.focusCid = -1; ui.lastHuman = -1;
    ui.humans = config.players.filter(function (p, i) { return p.kind === 'human' && isLocal(i); }).length;
    ui.me = -1;
    config.players.forEach(function (p, i) { if (p.kind === 'human' && isLocal(i) && ui.me < 0) ui.me = i; });
    var events = gme.events;
    if (cmds && cmds.length) {
      for (var i = 0; i < cmds.length; i++) {
        var r = E.applyCommand(game.state, cmds[i]);
        if (!r.ok) throw new Error(r.error);
        game.cmds.push(cmds[i]);
      }
      events = null;
      logLine('已接續上一局的進度', true);
      var a = E.actor(game.state);
      if (a >= 0 && game.state.players[a].kind === 'human' && isLocal(a)) { ui.me = a; ui.lastHuman = a; }
    }
    $('setup').hidden = true;
    $('modalLayer').innerHTML = '';
    ui.modal = null;
    scene.tweens.length = 0;
    scene.setState(game.state);
    scene.setPlayers(config.players.length);
    scene.dice.forEach(function (d) { d.visible = false; });
    view = makeView(game.state);
    if (events) {
      // 開場動畫前先顯示開局的股價
      view.prices = D.companies.map(function (c) { return c.price0; });
      view.quarter = 1; view.regime = 'flat'; view.macro = -1; view.prevIndex = 10000;
      scene.showPrices(view.prices);
    } else scene.syncAll();
    scene.markTurn(game.state.turn);
    if (g.innerWidth < 900) { scene.mode = 'follow'; scene.focusCell(game.state.players[game.state.turn].pos); } else scene.setMode('overview');
    syncViewBtn();
    save();
    ui.busy = true;
    renderAll();
    var token = game;
    (events ? playEvents(events) : Promise.resolve()).then(function () { if (token === game) step(); });
  }
