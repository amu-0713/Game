<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>紅盤環線</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：3D 棋盤舞台佔滿上方（電腦版在左），LED 看板式的行情列浮在舞台頂端；
   操作面板在下方（電腦版在右）。色彩取自老公寓磨石子地板與交易所行情看板，紅漲綠跌。 */
:root {
  --bg: #dfe7e1;
  --surface: #fbfbf7;
  --surface-2: #edf1ea;
  --ink: #1c2530;
  --ink-2: #5a6670;
  --line: #c8d2ca;
  --accent: #24459c;
  --accent-ink: #ffffff;
  --gold: #e9a81c;
  --gold-ink: #2e2100;
  --up: #cf3a2e;
  --down: #15834f;
  --up-bg: #fbe5e2;
  --down-bg: #dcf2e7;
  --board: #0d1420;
  --board-ink: #f2c230;
  --board-ink-2: #9fb0c4;
  --shade: rgba(20, 30, 40, 0.42);
  --scene-bg: #d3dfd8;
  --scene-ground: #dde6e0;
  --scene-tile: #f8f7f1;
  --scene-plaza: #eceee6;
  --scene-label: #ffffff;
  --scene-label-ink: #1c2530;
  --scene-speck1: #b9cbc2;
  --scene-speck2: #f6f1e4;
  --scene-speck3: #c2ab98;
  --scene-speck4: #8fa69c;
  --font-display: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-num: "Barlow Semi Condensed", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141c1b; --surface: #1e2827; --surface-2: #283433; --ink: #e9efea; --ink-2: #9db0a9; --line: #384644;
    --accent: #a3bcff; --accent-ink: #0e1a38; --gold: #f2c230; --gold-ink: #2e2100;
    --up: #ff7566; --down: #45d394; --up-bg: #4a2320; --down-bg: #173d2c;
    --board: #0a0f18; --board-ink: #f2c230; --board-ink-2: #8fa0b4; --shade: rgba(0, 0, 0, 0.6);
    --scene-bg: #111918; --scene-ground: #1b2625; --scene-tile: #c5cdc6; --scene-plaza: #2b3836;
    --scene-label: #f6f7f2; --scene-label-ink: #1c2530;
    --scene-speck1: #2b3a37; --scene-speck2: #3c4a45; --scene-speck3: #4a3f37; --scene-speck4: #141c1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141c1b; --surface: #1e2827; --surface-2: #283433; --ink: #e9efea; --ink-2: #9db0a9; --line: #384644;
  --accent: #a3bcff; --accent-ink: #0e1a38; --gold: #f2c230; --gold-ink: #2e2100;
  --up: #ff7566; --down: #45d394; --up-bg: #4a2320; --down-bg: #173d2c;
  --board: #0a0f18; --board-ink: #f2c230; --board-ink-2: #8fa0b4; --shade: rgba(0, 0, 0, 0.6);
  --scene-bg: #111918; --scene-ground: #1b2625; --scene-tile: #c5cdc6; --scene-plaza: #2b3836;
  --scene-label: #f6f7f2; --scene-label-ink: #1c2530;
  --scene-speck1: #2b3a37; --scene-speck2: #3c4a45; --scene-speck3: #4a3f37; --scene-speck4: #141c1b;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; overflow: hidden; overscroll-behavior: none; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.up { color: var(--up); }
.down { color: var(--down); }

#app { height: 100%; display: flex; flex-direction: column; }

/* ---------- 舞台 ---------- */
#stage { flex: 1 1 auto; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--scene-bg); }
#cvwrap { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-num); font-weight: 700; font-size: 15px; padding: 1px 7px; border-radius: 99px; background: var(--surface); box-shadow: 0 2px 8px var(--shade); white-space: nowrap; animation: rise 1.5s ease-out forwards; }
.floater.big { font-size: 18px; padding: 3px 10px; }
@keyframes rise { 0% { opacity: 0; margin-top: 8px; } 12% { opacity: 1; margin-top: 0; } 75% { opacity: 1; } 100% { opacity: 0; margin-top: -42px; } }

#hud { flex: 0 0 auto; background: var(--board); color: var(--board-ink-2); padding-block: 7px 8px; padding-left: var(--gut-l); padding-right: var(--gut-r); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.hud-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; min-width: 0; }
.hud-time { color: #e8eef5; font-weight: 700; white-space: nowrap; }
.lamp { font-weight: 700; white-space: nowrap; }
.lamp::before { content: ""; display: inline-block; width: 0.72em; height: 0.72em; border-radius: 50%; background: currentColor; margin-right: 5px; box-shadow: 0 0 8px currentColor; }
.lamp.bull { color: #ff6b5e; }
.lamp.flat { color: #f2c230; }
.lamp.bear { color: #35c486; }
.hud-index { white-space: nowrap; }
.hud-index b { color: #e8eef5; font-family: var(--font-num); font-size: 17px; font-weight: 700; }
.hud-event { grid-column: 1 / -1; color: var(--board-ink); font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud-event span { color: var(--board-ink-2); }
.hud-btns { display: flex; gap: 6px; }
.hud-btns button { min-width: 40px; height: 34px; padding: 0 9px; border-radius: 8px; border: 1px solid #33415a; color: #e8eef5; font-size: 13px; font-weight: 500; background: #18212f; }
.hud-btns button:hover { background: #223049; }
.hud-btns button.off { color: #6b7a90; text-decoration: line-through; }

#toasts { position: absolute; left: var(--gut-l); right: var(--gut-r); bottom: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { max-width: 100%; background: var(--board); color: #eef2f6; padding: 6px 13px; border-radius: 99px; font-size: 13.5px; box-shadow: 0 3px 12px var(--shade); animation: toast 2.6s ease forwards; text-align: center; }
.toast.err { background: var(--up); color: #fff; }
.toast b { color: var(--board-ink); font-weight: 700; }
@keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 8% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- 面板 ---------- */
#side { flex: 0 0 auto; background: var(--surface); border-top: 2px solid var(--ink); display: flex; flex-direction: column; min-height: 0; }
#players { display: flex; gap: 6px; padding-block: 8px 6px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.chip { flex: 1 1 0; min-width: 0; text-align: left; border: 1.5px solid var(--line); border-radius: 9px; padding: 4px 8px 5px; background: var(--surface); display: grid; grid-template-columns: auto 1fr; column-gap: 6px; align-items: center; }
.chip .dot { width: 19px; height: 19px; border-radius: 50%; align-self: center; color: #fff; font-family: var(--font-num); font-weight: 700; font-size: 13px; line-height: 19px; text-align: center; }
.chip .nm { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .tt { grid-column: 1 / -1; font-family: var(--font-num); font-weight: 700; font-size: 16px; line-height: 1.15; white-space: nowrap; }
.chip.on { border-color: var(--ink); background: var(--surface-2); box-shadow: 0 2px 0 var(--ink); }
.chip.on .nm { color: var(--ink); font-weight: 700; }

#feed { display: none; flex: 1 1 0; min-height: 0; overflow: hidden; flex-direction: column; justify-content: flex-end; padding-block: 6px; padding-left: var(--gut-l); padding-right: var(--gut-r); font-size: 13px; color: var(--ink-2); }
#feed div { padding: 3px 0; border-bottom: 1px solid var(--line); }
#feed .q { font-weight: 700; color: var(--ink); border: 0; padding-top: 8px; }
#panel { padding-block: 4px 12px; padding-left: var(--gut-l); padding-right: var(--gut-r); display: flex; flex-direction: column; gap: 9px; }
#ctx { min-height: 96px; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.ctx-title { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.25; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 9px; }
.ctx-title small { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--ink-2); }
.ctx-text { color: var(--ink-2); font-size: 14px; }
.ctx-text b { color: var(--ink); }
.kv { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13.5px; color: var(--ink-2); }
.kv b { color: var(--ink); font-family: var(--font-num); font-size: 15.5px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 5px; line-height: 1.6; white-space: nowrap; font-family: var(--font-body); }
.tag.cheap { background: var(--down-bg); color: var(--down); }
.tag.pricey { background: var(--up-bg); color: var(--up); }
.tag.fair { background: var(--surface-2); color: var(--ink-2); }
.tag.sec { color: #fff; }

.trade { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--ink); border-radius: 9px; overflow: hidden; background: var(--surface); }
.stepper button { width: 40px; height: 40px; font-size: 20px; font-weight: 700; }
.stepper button:hover { background: var(--surface-2); }
.stepper output { min-width: 46px; text-align: center; font-family: var(--font-num); font-weight: 700; font-size: 18px; }
.stepper .max { width: auto; padding: 0 10px; font-size: 13px; border-left: 1.5px solid var(--ink); }

#acts { display: flex; gap: 7px; align-items: stretch; }
.btn { min-height: 44px; padding: 0 13px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--surface); font-weight: 700; font-size: 14.5px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 3px 0 var(--ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: var(--gold-ink); }
.btn.sell { border-color: var(--down); color: var(--down); }
.btn.merge { background: #7a4fb8; border-color: #7a4fb8; color: #fff; }
.btn.small.on { background: var(--ink); color: var(--surface); }
.tabs.tight { margin: 0; flex-wrap: wrap; }
.tabs.tight button { padding: 4px 11px; font-size: 13px; }
.btn.buy { background: var(--up); border-color: var(--up); color: #fff; }
.btn.small { min-height: 36px; padding: 0 10px; font-size: 13.5px; border-radius: 8px; }
.btn.grow { flex: 1 1 auto; }
.btn[disabled] { opacity: 0.4; cursor: default; box-shadow: none; }
.btn .n { font-family: var(--font-num); background: var(--ink); color: var(--surface); border-radius: 99px; min-width: 20px; padding: 0 5px; font-size: 13px; line-height: 20px; }
#mainBtn { flex: 1 1 auto; font-size: 17px; font-family: var(--font-display); }

/* ---------- 抽屜與對話框 ---------- */
.overlay { position: fixed; inset: 0; background: var(--shade); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.tdot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; }
#sheetLayer .overlay { z-index: 50; }
#modalLayer .overlay { z-index: 60; }
.overlay.center { align-items: center; padding: 16px var(--gut-r) 16px var(--gut-l); }
.sheet { width: 100%; max-width: 640px; max-height: 88%; background: var(--surface); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; gap: 10px; padding-block: 12px 8px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 21px; flex: 1 1 auto; text-wrap: balance; }
.sheet-body { overflow-y: auto; padding-block: 0 18px; padding-left: var(--gut-l); padding-right: var(--gut-r); min-height: 0; -webkit-overflow-scrolling: touch; }
.x { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--ink); font-size: 18px; font-weight: 700; flex: 0 0 auto; }
.x:hover { background: var(--surface-2); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs button { padding: 6px 13px; border-radius: 99px; border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; }
.tabs button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.sec-head { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; font-weight: 700; font-size: 14px; }
.sec-head i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sec-head span { font-weight: 500; color: var(--ink-2); font-size: 12.5px; }
.stock { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 58px 58px 46px; gap: 6px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.stock:hover { background: var(--surface-2); }
.stock .nm { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-weight: 700; }
.stock .nm small { font-weight: 400; color: var(--ink-2); font-size: 12px; }
.stock .r { text-align: right; font-family: var(--font-num); font-weight: 600; font-size: 16px; }
.stock .own { text-align: right; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.stock .own b { font-family: var(--font-num); font-size: 15px; color: var(--ink); }
.stock-cols { display: grid; grid-template-columns: minmax(0, 1fr) 58px 58px 46px; gap: 6px; padding: 0 6px; font-size: 12px; color: var(--ink-2); text-align: right; }
.stock-cols span:first-child { text-align: left; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.facts div { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--ink-2); }
.facts b { display: block; font-family: var(--font-num); font-size: 18px; color: var(--ink); line-height: 1.25; }
.facts b.up, .kv b.up { color: var(--up); }
.facts b.down, .kv b.down { color: var(--down); }
.block { border-top: 1px solid var(--line); padding: 12px 0; display: flex; flex-direction: column; gap: 8px; }
.block h3 { margin: 0; font-size: 14px; }
.hrow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; }
.exp-sum { font-weight: 500; font-size: 12.5px; color: var(--ink-2); }
.exp-sum b { color: var(--ink); font-family: var(--font-num); }
.stock .nm small.exp { flex-basis: 100%; font-size: 11.5px; color: var(--ink-2); font-weight: 400; font-family: var(--font-num); }
.muted { color: var(--ink-2); font-size: 13.5px; }
.holders { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; }
.holders i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }

.card { border: 1.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; margin-bottom: 9px; box-shadow: 0 3px 0 var(--ink); }
.regime-box { border-radius: 10px; padding: 8px 12px; margin: 2px 0 10px; font-size: 13.5px; background: var(--surface-2); border-left: 4px solid var(--gold); }
.regime-box.fcbox div { margin-top: 3px; }
.hud-event .fc { color: #e8eef5; }
.hud-event .fcl { margin-left: 1em; }
@media (max-width: 899px) { .hud-event .fcl { display: block; margin-left: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } }
.offer { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.offer-card { text-align: left; border: 1.5px solid var(--ink); border-radius: 10px; padding: 6px 8px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.offer-card b { font-family: var(--font-display); font-size: 15px; }
.offer-card small { font-size: 11px; font-weight: 700; color: var(--ink-2); }
.offer-card span { font-size: 11.5px; color: var(--ink-2); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.offer-card em { font-style: normal; font-weight: 700; font-size: 12.5px; color: var(--accent); margin-top: auto; }
.offer-card:hover { background: var(--surface-2); }
.offer-card[disabled] { opacity: 0.45; cursor: default; }
.modal-offer { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); margin-top: 4px; }
.modal-offer .offer-card span { -webkit-line-clamp: 4; }
.offer-card.sold { border-style: dashed; color: var(--ink-2); justify-content: center; align-items: center; }
.offer-card.cat-attack small { color: var(--up); }
.offer-card.cat-action small { color: var(--down); }
.regime-box.bull { border-left-color: var(--up); }
.regime-box.bear { border-left-color: var(--down); }
.card .cat { font-weight: 700; padding: 0 7px; border-radius: 5px; background: var(--surface-2); }
.card.cat-attack .cat { background: var(--up-bg); color: var(--up); }
.card.cat-neutral .cat { background: var(--surface-2); color: var(--ink-2); }
.card.cat-action .cat, .card.cat-fixed .cat { background: var(--down-bg); color: var(--down); }
.card-acts .pick, .trade .pick { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.card-acts .btn.small, .trade .pick .btn.small { min-width: 34px; }
.card.active { background: var(--surface-2); box-shadow: none; border-color: var(--line); }
.card-top { display: flex; align-items: baseline; gap: 8px; }
.card-top b { font-family: var(--font-display); font-size: 18px; }
.card-top small { color: var(--ink-2); font-size: 12.5px; }
.card-top .left { margin-left: auto; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.card p { margin: 0; font-size: 14px; }
.card-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }

.log { font-size: 13.5px; display: flex; flex-direction: column; }
.log div { padding: 4px 0; border-bottom: 1px solid var(--line); }
.log .q { font-weight: 700; background: var(--surface-2); padding: 4px 8px; border-radius: 6px; border: 0; margin-top: 8px; }

.event { width: 100%; max-width: 380px; background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: 16px 18px 14px; box-shadow: 0 6px 0 var(--ink); display: flex; flex-direction: column; gap: 8px; animation: pop 0.22s ease-out; }
.event.hit { border-color: var(--up); box-shadow: 0 6px 0 var(--up); }
.event.hit .kicker { color: var(--up); }
.event.swan { background: var(--board); color: #eef2f6; border-color: #000; }
.event.swan .ctx-text { color: #b5c1d0; }
@keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }
.kicker { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; color: var(--ink-2); }
.event.swan .kicker { color: var(--board-ink); }
.event h2 { margin: 0; font-family: var(--font-display); font-size: 27px; line-height: 1.2; text-wrap: balance; }
.fx { display: flex; flex-wrap: wrap; gap: 6px; }
.fx span { font-family: var(--font-num); font-weight: 700; font-size: 15px; padding: 1px 9px; border-radius: 6px; }
.fx .u { background: var(--up-bg); color: var(--up); }
.fx .d { background: var(--down-bg); color: var(--down); }
.event .hint { font-size: 12px; color: var(--ink-2); text-align: right; }
.event.swan .hint { color: #8fa0b4; }
.rank { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; font-size: 15px; }

/* ---------- 開局 ---------- */

.h-card { border: 1.5px solid var(--ink); border-radius: 10px; padding: 8px 10px; background: var(--surface); box-shadow: 0 3px 0 var(--ink); display: flex; flex-direction: column; gap: 4px; border-top-width: 6px; }
.h-card.cat-attack { border-top-color: var(--up); }

.h-card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }

.h-when { font-size: 11px; font-weight: 700; white-space: nowrap; padding: 0 6px; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); }

<body>
<div id="app">
  <div id="stage">
    <header id="hud">
      <div class="hud-main">
        <span class="hud-time" id="hudTime">紅盤環線</span>
        <span class="lamp flat" id="hudLamp">盤整</span>
        <span class="hud-index">大盤 <b id="hudIndex">10,000</b> <span class="num" id="hudChg"></span></span>
      </div>
      <div class="hud-btns">
        <button id="btnView" data-act="view" title="切換全覽或跟隨棋子">全覽</button>
        <button id="btnSpeed" data-act="speed" title="動畫速度">1×</button>
        <button id="btnLabels" data-act="labels" title="顯示或隱藏棋盤上的公司名牌">名牌</button>
        <button data-act="help">規則</button>
      </div>
      <div class="hud-event" id="hudEvent">每季開盤會翻一張總經事件</div>
    </header>
    <div id="cvwrap">
      <canvas id="cv" aria-label="紅盤環線棋盤"></canvas>
      <div id="floaters"></div>
      <div id="toasts" aria-live="polite"></div>
    </div>
  </div>
  <section id="side" aria-label="操作面板">
    <div id="players"></div>
    <div id="feed" aria-hidden="true"></div>
    <div id="panel">
      <div id="ctx"></div>
      <div id="acts"></div>
    </div>
  </section>
</div>
<div id="sheetLayer"></div>
<div id="modalLayer"></div>
<div id="setup"></div>

<template id="tplRules">
  <h3>目標</h3>
  <p>每人 100 萬起家（開局可以改金額），開局手上有「遠端下單」和「加班趕路」各一張。玩 5 年共 20 季。最後現金加上持股市值最高的人獲勝。</p>

  <h3>一季怎麼進行</h3>
  <ol>
    <li><b>開盤</b>：翻一張總經事件，相關產業一起漲跌；每家公司再各自小幅波動；接著亮出本季的景氣燈號。</li>
    <li><b>每人行動一次</b>：自己選擲一顆或兩顆骰子前進，執行停留格子的效果。擲骰前後都可以賣股票、出策略卡。</li>
    <li><b>收盤</b>：記錄股價；每年第 4 季收盤發股息與大股東權益報酬。</li>
  </ol>
  <p>先手每季輪流。時間只看「季」，走得快只會多經過幾次結算站，不會比別人多行動。</p>

  <h3>景氣燈號</h3>
  <p>參考台灣的景氣對策信號，遊戲有一個<b>景氣分數</b>（9～45 分，開局 25 分）。每季開盤時依總經事件加減分（景氣復甦、熱錢湧入加很多，景氣衰退、外資提款扣很多），再往 25 分拉回（離得越遠拉得越多）；黑天鵝也會扣分。同一個燈號每多維持一季，央行就多出手一點：空頭時救市加分、多頭時打房降溫扣分，所以燈號不會一直卡在同一邊。分數決定燈號：</p>
  <ul>
    <li><b class="up">多頭季</b>（28 分以上）：<b>季末全市場 +5%</b>，現金年利率 1%；一般買進原價、併購溢價 15%、賣出免交易成本。</li>
    <li><b>盤整季</b>（22～27 分）：季末全市場不變，現金年利率 2%；一般買進原價、併購溢價 10%、賣出交易成本 1%。</li>
    <li><b class="down">空頭季</b>（21 分以下）：<b>季末全市場 −8%</b>，現金年利率 6%；一般買進打九折、併購溢價只要 5%、賣出交易成本 1%。</li>
  </ul>
  <p>季末漲跌看的是<b>季末當下</b>的燈號：有人踩到央行改了分數、或打出景氣轉向，這一季的季末就跟著變。空頭季全倉會大賠，記得看燈號。</p>
  <p><b>個股事件</b>：從第二季開始，每季開盤有六成機率，隨機一家公司財報爆雷或接到大單。之後這一季每位玩家移動時，這家公司再跌或漲 5%～7%（四人局共四次）。早點發現就能趁早進場或逃跑。</p>
  <p><b>封關年（第 5 年）</b>：總經事件的影響加倍（照常提前一季預告），每季一定有個股事件，而且每次移動漲跌 8%～10%。領先的人要守住，落後的人可以放手一搏。</p>
  <p><b>經濟預告</b>：每季開盤後會公布下一季的兩個候選總經事件，下一季會從這兩個裡面各半機率發生一個。所有人看得到，可以提前佈局。</p>
  <p>分數要累積才會換燈，所以燈號通常會維持兩季左右，很少超過一年。看分數接近門檻，就可以提前準備：快進多頭時先買、快進空頭時先賣或留現金等著撿便宜。</p>
  <p>台股習慣紅色代表漲、綠色代表跌，遊戲裡也一樣。</p>

  <h3>格子</h3>
  <ul>
    <li><b>公司</b>（24 格）：可以用當下股價買進這家公司，每次最多 10 張。</li>
    <li><b>結算站</b>：經過或停留會拿到一張「遠端下單」，再抽一張策略卡。不發錢。</li>
    <li><b>策略會議</b>（角落）：經過時抽 2 張策略卡、選 1 張留下；停在這裡抽 3 張、選 2 張留下。</li>
    <li><b>證券交易所</b>（角落）：可以買進任一家公司，最多 10 張，也可以併購。</li>
    <li><b>黑天鵝</b>（角落，結算站正對面）：翻開一張全市場大事件，所有人同時受影響。</li>
    <li><b>卡片交易所</b>（角落）：經過時貨架有 3 張卡，可以買 1 張；停在這裡貨架有 5 張，可以買 2 張。每張 3 萬，只能買不能換。</li>
    <li><b>央行</b>（角落）：由你決定降息（景氣分數 +3）或升息（景氣分數 −3），本季燈號馬上跟著變。</li>
    <li><b>法說會</b>（長邊中間）：隨機一家公司擲骰上漲 5%～10%。</li>
    <li><b>法會</b>（長邊中間）：法會辦得不太順利，隨機一家公司擲骰下跌 5%～10%。</li>
  </ul>

  <h3>買賣股票</h3>
  <ul>
    <li>股價單位是元，一張的價錢是股價乘以 1,000。股價 50 元，一張就是 5 萬。</li>
    <li>買：踩到公司格、證券交易所最多 10 張；用「遠端下單」最多 5 張，而且不能買你站著的那一家。不收手續費。</li>
    <li>併購：能買的時候，也可以向其他玩家買走他手上的股票，價格是市價加溢價（多頭 15%、盤整 10%、空頭 5%），全部付給對方。併購另外有每回合 10 張的額度，和一般買進分開算。遠端下單不能併購。敵意併購可以免溢價、不限張數。</li>

(function (g) {
  'use strict';
  var RL = (g.RL = g.RL || {});

  function hash(seed) {
    var s = String(seed), h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // st 是任何帶有 rng（uint32）欄位的物件
  function next(st) {
    st.rng = (st.rng + 0x6d2b79f5) >>> 0;
    var t = st.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function int(st, n) {
    return Math.floor(next(st) * n);
  }

  function shuffle(st, arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = int(st, i + 1);
      var t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }

  }

<script>
/* 紅盤環線 — 規則層。不碰畫面：createGame 建立狀態，applyCommand 處理指令並回傳事件紀錄。
   同一組種子 + 同一串指令 = 完全相同的一局。 */
(function (g) {
  'use strict';
  var RL = (g.RL = g.RL || {});
  var D = RL.data, K = D.K, R = RL.rng;
  var NC = D.companies.length, NB = D.board.length;

  // ---------- 小工具 ----------
  function clampPrice(x) { return Math.max(K.minPrice, Math.min(K.maxPrice, Math.round(x))); }
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function lotValue(s, cid) { return s.prices[cid] * 100; }
  function holdingsValue(s, pid) {
    var p = s.players[pid], v = 0;
    for (var i = 0; i < NC; i++) if (p.holdings[i]) v += p.holdings[i] * s.prices[i] * 100;
    return v;
  }
  function total(s, pid) { return s.players[pid].cash + holdingsValue(s, pid); }
  function marketIndex(s) {
    var a = 0;
    for (var i = 0; i < NC; i++) a += s.prices[i];
    return Math.round((a / s.sum0) * 10000);
  }
  function tag(s, cid) {
    var r = s.prices[cid] / s.fair[cid];
    return r < K.cheap ? 'cheap' : r > K.pricey ? 'pricey' : 'fair';
  }
  function hasActive(p, type) {
    for (var i = 0; i < p.active.length; i++) if (p.active[i].type === type) return p.active[i];
    return null;
  }
  function fxPct(card, c) {
    var v = card.sectors && card.sectors[c.sector] !== undefined ? card.sectors[c.sector] : card.all || 0;
    if (card.hv && c.vol === 'H') v += card.hv;
    return v / 100;
  }
  function actor(s) {
    if (s.phase === 'over') return -1;
    return s.phase === 'major' ? s.pending.major : s.turn;
  }
  // 個股帳本：每位玩家每檔股票的買進、賣出、股息、大股東報酬，以及每次進出的季別
  function book(s, pid, cid, k, n, amt) {
    var p = s.players[pid];
    if (!p.book) p.book = {};
    var b = p.book[cid] || (p.book[cid] = { buy: 0, sell: 0, div: 0, major: 0, marks: [] });
    if (k === 'b' || k === 'mi') b.buy += amt;
    else if (k === 's' || k === 'mo' || k === 'f') b.sell += amt;
    else if (k === 'div') { b.div += amt; return; }
    else if (k === 'major') { b.major += amt; return; }
    b.marks.push({ q: s.quarter, k: k, n: n, px: s.prices[cid] });
  }
  // 股權鎖定：這位玩家在這家公司的持股，鎖定期間不能被併購
  function locked(s, pid, cid) { var p = s.players[pid]; return !!(p && p.locks && p.locks[cid] >= s.quarter); }
  function lockable(s, pid) { var out = []; for (var i = 0; i < NC; i++) if (s.major[i] === pid && !locked(s, pid, i)) out.push(i); return out; }
  function addCash(s, pid, amt, why, ev) {
    var p = s.players[pid];
    if (amt < 0 && p.cash + amt < 0) amt = -p.cash;
    if (!amt) return 0;
    p.cash += amt;
    ev.push({ t: 'cash', p: pid, amt: amt, why: why });
    return amt;
  }
  function cardStat(s, type, amt) {
    var st = s.stats.cards[type] || (s.stats.cards[type] = { plays: 0, gain: 0 });
    st.gain += amt;
  }

  // ---------- 牌堆 ----------
  function drawCard(s, pid, ev) {
    if (!s.cardDeck.length) {
      if (!s.cardDiscard.length) return;
      s.cardDeck = R.shuffle(s, s.cardDiscard.filter(function (x) { return D.cards[x].count > 0; }));
      s.cardDiscard = [];
    }
    var type = s.cardDeck.pop();
    var c = { uid: s.uid++, type: type };
    s.players[pid].hand.push(c);
    ev.push({ t: 'draw', p: pid, card: type, uid: c.uid });
  }
  // 直接發一張指定的卡（開局與結算站的固定道具），不經過牌堆
  function giveCard(s, pid, type, ev) {
    var c = { uid: s.uid++, type: type };
    s.players[pid].hand.push(c);
    ev.push({ t: 'draw', p: pid, card: type, uid: c.uid, given: true });
  }
  function drawFrom(s, key, n) {
    if (!s[key].length) {
      var arr = [];
      for (var i = 0; i < n; i++) arr.push(i);
      s[key] = R.shuffle(s, arr);
    }
    return s[key].pop();
  }

  // ---------- 股價 ----------
  // pct：長度 NC 的陣列（小數）。事件造成的漲跌會觸發低波動、產業輪動卡。
  function applyEvent(s, pct, cause, ev, share) {
    var changes = [], i;
    for (i = 0; i < NC; i++) {
      if (!pct[i]) continue;
      var from = s.prices[i], to = clampPrice(from * (1 + pct[i]));
      s.fair[i] *= 1 + pct[i] * (share === undefined ? K.fairShare : share);
      if (to !== from) {
        s.prices[i] = to;
        changes.push({ cid: i, from: from, to: to });
      }
    }
    if (!changes.length) return;
    ev.push({ t: 'prices', cause: cause, changes: changes });
    if (cause === 'pump') return;
    for (var pid = 0; pid < s.players.length; pid++) {
      var p = s.players[pid];
      var low = hasActive(p, 'lowvol'), rot = hasActive(p, 'rotate');
      if (!low && !rot) continue;
      var loss = 0, gain = 0;
      for (i = 0; i < changes.length; i++) {
        var ch = changes[i], n = p.holdings[ch.cid];
        if (!n) continue;
        var d = (ch.to - ch.from) * 100 * n;
        if (d < 0) loss -= d;
        else if (rot && D.companies[ch.cid].sector === rot.sector) gain += d;
      }
      if (low && loss > 0) {
        var a = Math.round(loss * K.lowvolComp);
        p.cash += a;
        cardStat(s, 'lowvol', a);
        ev.push({ t: 'cardfx', p: pid, card: 'lowvol', amt: a });
      }
      if (rot && gain > 0) {
        var b = Math.round(gain * K.rotateBonus);
        p.cash += b;
        cardStat(s, 'rotate', b);
        ev.push({ t: 'cardfx', p: pid, card: 'rotate', amt: b, sector: rot.sector });
      }
    }
  }

  // 查帳罰款（年底）：持股市值的 5% × 被查次數；年底發的錢已經先入帳，再扣現金，不夠就從市值最高的股票開始強制賣出（不收手續費）
  function auditFine(s, pid, ev) {
    var p = s.players[pid], by = p.auditBy || [], times = by.length, fine = Math.round(holdingsValue(s, pid) * K.auditFine * times), sold = [];
    p.audits = 0; p.auditBy = [];
    if (!times) return 0;
    while (p.cash < fine) {
      var best = -1, bv = 0;
      for (var i = 0; i < NC; i++) if (p.holdings[i] && p.holdings[i] * lotValue(s, i) > bv) { bv = p.holdings[i] * lotValue(s, i); best = i; }
      if (best < 0) break;
      var n = Math.min(p.holdings[best], Math.ceil((fine - p.cash) / lotValue(s, best)));
      p.costBasis[best] = Math.round((p.costBasis[best] * (p.holdings[best] - n)) / p.holdings[best]);
      p.holdings[best] -= n;
      p.cash += n * lotValue(s, best);
      book(s, pid, best, 'f', n, n * lotValue(s, best));
      sold.push({ cid: best, qty: n });
      updateMajor(s, best, ev);
    }
    fine = Math.min(fine, p.cash);
    p.cash -= fine;
    p.auditPaid = (p.auditPaid || 0) + fine;
    s.stats.auditFines = (s.stats.auditFines || 0) + fine;
    // 檢舉獎金：每一次查帳的人分到一份
    var paid = 0, to = [];
    by.forEach(function (a, k) {
      var share = k === by.length - 1 ? fine - paid : Math.floor(fine / times);
      paid += share;
      s.players[a].cash += share;
      s.players[a].auditGot = (s.players[a].auditGot || 0) + share;
      to.push({ p: a, amt: share });
    });
    ev.push({ t: 'audit_fine', p: pid, fine: fine, sold: sold, times: times, to: to, year: s.quarter / 4 });
    return fine;
  }
  // 能賣幾張：這回合剛買進（含併購）的張數要等下一回合才能賣
  function sellable(s, pid, cid) {
    var p = s.players[pid], fresh = s.turn === pid && s.ctx && s.ctx.fresh ? s.ctx.fresh[cid] || 0 : 0;
    return Math.max(0, p.holdings[cid] - fresh);
  }
  function updateMajor(s, cid, ev) {
    var max = 0, who = [], i;
    for (i = 0; i < s.players.length; i++) {
      var n = s.players[i].holdings[cid];
      if (n > max) { max = n; who = [i]; }
      else if (n === max && n > 0) who.push(i);
    }
    var cur = s.major[cid], next = max >= K.majorMin && who.length === 1 ? who[0] : -1;
    if (next !== cur) {
      s.major[cid] = next;
      ev.push({ t: 'major_change', cid: cid, from: cur, to: next });
    }
  }

  // ---------- 季的開始與結束 ----------
  function startQuarter(s, ev) {
    s.quarter++;
    var n = s.players.length, i;
    s.first = (K.rotateFirst === 'quarter' ? s.quarter - 1 : K.rotateFirst === 'year' ? Math.floor((s.quarter - 1) / 4) : 0) % n;
    s.order = 0;
    s.turn = s.first;
    for (i = 0; i < n; i++) s.players[i].sold = false;
    s.prevClose = s.prices.slice();
    ev.push({ t: 'quarter', q: s.quarter, year: Math.ceil(s.quarter / 4), season: ((s.quarter - 1) % 4) + 1, first: s.first });

    // 第一季沒有總經事件：開局先公布下季預告，讓大家有一季時間佈局
    var m = s.forecast ? D.macro[s.forecast[R.int(s, 2)]] : { id: -1, all: 0, score: 0 };
    s.macro = m.id;
    if (s.quarter === K.finalYearFrom) ev.push({ t: 'finalyear', q: s.quarter });
    if (m.id >= 0) {
      var mult = D.macroMult(s.quarter);
      ev.push({ t: 'macro', id: m.id, mult: mult });
      var pct = [];
      for (i = 0; i < NC; i++) pct.push(fxPct(m, D.companies[i]) * mult);
      applyEvent(s, pct, 'macro', ev);
    }

    // 個股事件：財報爆雷或接到大單，影響會反映在合理價上，不會很快漲回來
    s.stockEvent = null;
    // 第一季開局不會有個股事件
    if (s.quarter > 1 && R.next(s) < (s.quarter >= K.finalYearFrom ? K.finalStockP : K.stockEventP)) {
      s.stockEvent = { cid: R.int(s, NC), up: R.next(s) < 0.5, left: s.players.length };
      ev.push({ t: 'stockfx', cid: s.stockEvent.cid, up: s.stockEvent.up, steps: s.stockEvent.left });
    }

    // 開盤波動：題材餘溫 + 個股隨機 + 向合理價靠攏；合理價長期成長
    var changes = [];
    for (i = 0; i < NC; i++) {
      var c = D.companies[i], from = s.prices[i];
      var tr = s.trend[c.sector] || 0;
      var noise = (R.next(s) + R.next(s) - 1) * K.vol[c.vol];
      var rev = clamp(K.rev * (s.fair[i] / from - 1), -K.revClamp, K.revClamp);
      // 股價跟著合理價一起長期成長，回歸項只處理偏離，避免股價長期落後合理價
      var to = clampPrice(from * (1 + K.growth[c.sector] * (K.priceDrift || 0) + tr + noise + rev));
      s.fair[i] *= (1 + K.growth[c.sector]) * (1 + tr * K.fairShare);
      if (to !== from) { s.prices[i] = to; changes.push({ cid: i, from: from, to: to }); }
    }
    if (changes.length) ev.push({ t: 'prices', cause: 'open', changes: changes });
    for (i = 0; i < D.sectors.length; i++) {
      var sid = D.sectors[i].id;
      var sp = m.sectors && m.sectors[sid] !== undefined ? m.sectors[sid] : m.all || 0;
      s.trend[sid] = (sp / 100) * K.carry;
    }

    var idx = marketIndex(s), last = s.indexHist[s.indexHist.length - 1];
    var before = s.score;
    s.score += Math.round(m.score * (K.scoreScale || 1));
    // 反向拉扯：離中間越遠拉回越多；同一個燈號維持越久，央行救市（空頭）或打房降溫（多頭）的力道越大
    var gapMid = K.scoreMid - s.score;
    s.score += gapMid > 0 ? Math.max(K.scoreDrift, Math.round(gapMid * (K.scoreRevK || 0))) : gapMid < 0 ? -Math.max(K.scoreDrift, Math.round(-gapMid * (K.scoreRevK || 0))) : 0;
    var prev = s.regime;
    if (prev === 'bear') s.score += Math.min(K.streakMax || 0, (s.streak || 0) * (K.streakPush || 0));
    if (prev === 'bull') s.score -= Math.min(K.streakMax || 0, (s.streak || 0) * (K.streakPush || 0));
    s.score = clamp(s.score, K.scoreMin, K.scoreMax);
    s.regime = regimeOf(s.score);
    s.streak = s.quarter > 1 && s.regime === prev ? (s.streak || 0) + 1 : 0;
    s.flipped = false;
    s.cardHit = {};
    s.indexHist.push(idx);
    s.scoreHist.push(s.score);
    s.stats.regimes[s.regime]++;
    ev.push({ t: 'regime', regime: s.regime, from: last, to: idx, score: s.score, scoreFrom: before });
    if (s.quarter < s.quarters) {
      var fa = R.int(s, D.macro.length), fb = R.int(s, D.macro.length - 1);
      if (fb >= fa) fb++;
      s.forecast = [fa, fb];
      ev.push({ t: 'forecast', a: fa, b: fb });
    } else s.forecast = null;

    beginTurn(s, ev);
  }

  function regimeOf(score) { return score >= K.scoreBull ? 'bull' : score <= K.scoreBear ? 'bear' : 'flat'; }
  function rules(s) { return K.regimeRules[s.regime]; }

  function beginTurn(s, ev) {
    s.phase = 'pre';
    s.pending = null;
    s.ctx = { dice: null, allow: [], rolled: false, extraBuy: 0, noPremium: false, treasury: false, fresh: {} };
    ev.push({ t: 'turn', p: s.turn });
  }

  // 每季收盤記錄大盤與各產業相對開局的指數（開局 = 100），給結算圖表用
  function recordClose(s) {
    var sum = {}, base = {}, all = 0, k;
    for (var c = 0; c < NC; c++) {
      var sec = D.companies[c].sector;
      sum[sec] = (sum[sec] || 0) + s.prices[c];
      base[sec] = (base[sec] || 0) + D.companies[c].price0;
      all += s.prices[c];
    }
    s.closeHist.all.push(Math.round((all / s.sum0) * 1000) / 10);
    if (s.priceHist) for (c = 0; c < NC; c++) s.priceHist[c].push(s.prices[c]);
    for (k in sum) s.closeHist[k].push(Math.round((sum[k] / base[k]) * 1000) / 10);
  }
  // 年底發放：每張持股的股息，加上大股東持股市值的 5%（權益報酬）
  function yearPayout(s, ev) {
    for (var i = 0; i < s.players.length; i++) {
      var p = s.players[i], div = 0, majVal = 0, interest = p.interestAcc || 0;
      p.interestAcc = 0;
      for (var c = 0; c < NC; c++) {
        if (!p.holdings[c]) continue;
        div += p.holdings[c] * D.companies[c].div;
        if (s.major[c] === i) majVal += p.holdings[c] * lotValue(s, c);
      }
      var divExtra = div > 0 && hasActive(p, 'highdiv') ? Math.round(div * (K.highdivMult - 1)) : 0;
      var maj = Math.round(majVal * K.majorYield);
      var dm = div > 0 && hasActive(p, 'highdiv') ? K.highdivMult : 1, mm = hasActive(p, 'seat') ? K.seatMult : 1;
      for (c = 0; c < NC; c++) {
        if (!p.holdings[c]) continue;
        book(s, i, c, 'div', 0, Math.round(p.holdings[c] * D.companies[c].div * dm));
        if (s.major[c] === i) book(s, i, c, 'major', 0, Math.round(p.holdings[c] * lotValue(s, c) * K.majorYield * mm));
      }
      var majExtra = maj > 0 && hasActive(p, 'seat') ? Math.round(maj * (K.seatMult - 1)) : 0;
      if (divExtra) cardStat(s, 'highdiv', divExtra);
      if (majExtra) cardStat(s, 'seat', majExtra);
      var amt = div + divExtra + maj + majExtra + interest;
      if (!amt) continue;
      p.cash += amt;
      p.divGot = (p.divGot || 0) + div + divExtra;
      p.interestGot = (p.interestGot || 0) + interest;
      p.majorGot = (p.majorGot || 0) + maj + majExtra;
      s.stats.dividends += div + divExtra;
      s.stats.majorReturn += maj + majExtra;
      ev.push({ t: 'payout', p: i, year: s.quarter / 4, div: div + divExtra, divExtra: divExtra, major: maj + majExtra, majorExtra: majExtra, interest: interest });
    }
  }
  function endQuarter(s, ev) {
    var i, j;
    ev.push({ t: 'qend', q: s.quarter });
    for (i = 0; i < s.players.length; i++) s.players[i].interestAcc = (s.players[i].interestAcc || 0) + Math.round(s.players[i].cash * K.cashRateQ[s.regime]);
    var dr = K.regimeDrift[s.regime] * (s.quarter >= K.finalYearFrom ? (K.finalDriftMult || 1) : 1);
    if (dr) {
      var dpct = [];
      for (i = 0; i < NC; i++) dpct.push(dr);
      ev.push({ t: 'drift', regime: s.regime, pct: Math.round(dr * 100) });
      applyEvent(s, dpct, 'drift', ev);
    }
    if (s.quarter % 4 === 0) {
      yearPayout(s, ev);
      for (i = 0; i < s.players.length; i++) auditFine(s, i, ev);
    }
    for (i = 0; i < s.players.length; i++) {
      var p = s.players[i], a;
      if (s.regime === 'bull' && hasActive(p, 'momentum')) {
        a = Math.round(holdingsValue(s, i) * K.momentumPct);
        if (a > 0) { p.cash += a; cardStat(s, 'momentum', a); ev.push({ t: 'cardfx', p: i, card: 'momentum', amt: a }); }
      }
      if (s.regime === 'bear' && hasActive(p, 'hedge')) {
        a = Math.round(p.cash * K.hedgePct);
        if (a > 0) { p.cash += a; cardStat(s, 'hedge', a); ev.push({ t: 'cardfx', p: i, card: 'hedge', amt: a }); }
      }
      if (hasActive(p, 'discipline') && !p.sold && holdingsValue(s, i) > 0) {
        a = K.disciplineAmt;
        p.cash += a; cardStat(s, 'discipline', a); ev.push({ t: 'cardfx', p: i, card: 'discipline', amt: a });
      }
      for (j = p.active.length - 1; j >= 0; j--) {
        if (--p.active[j].left <= 0) {
          ev.push({ t: 'expire', p: i, card: p.active[j].type });
          s.cardDiscard.push(p.active[j].type);
          p.active.splice(j, 1);
        }
      }
      p.history.push(total(s, i));
    }
    recordClose(s);
    if (s.quarter % 4 === 0 && s.quarter < s.quarters) ev.push({ t: 'year', year: s.quarter / 4, ranking: ranking(s) });
    if (s.quarter >= s.quarters) {
      s.phase = 'over';
      s.result = ranking(s);
      ev.push({ t: 'over', ranking: s.result });
    } else {
      startQuarter(s, ev);
    }
  }

  function ranking(s) {
    var r = s.players.map(function (p, i) { return { p: i, total: total(s, i), cash: p.cash }; });
    r.sort(function (a, b) { return b.total - a.total || b.cash - a.cash || a.p - b.p; });
    return r;
  }

  // ---------- 移動與格子 ----------
  function settle(s, pid, ev) {
    s.players[pid].laps++;
    ev.push({ t: 'settle', p: pid });
    giveCard(s, pid, 'remote', ev);
    for (var i = 0; i < K.settleDraw; i++) drawCard(s, pid, ev);
  }

  // 依牌堆張數加權，隨機產生卡片種類（卡片交易所的貨架用，不動到牌堆）
  function randomType(s) {
    var pool = [], k;
    for (k in D.cards) for (var n = 0; n < D.cards[k].count; n++) pool.push(k);
    return pool[R.int(s, pool.length)];
  }
  function takeType(s) {
    if (!s.cardDeck.length) {
      s.cardDeck = R.shuffle(s, s.cardDiscard.filter(function (x) { return D.cards[x].count > 0; }));
      s.cardDiscard = [];
    }
    return s.cardDeck.length ? s.cardDeck.pop() : randomType(s);
  }
  function openShop(s, pid, n, buys, landed, ev) {
    var cards = [];
    for (var i = 0; i < n; i++) cards.push(randomType(s));
    s.ctx.shop = { cards: cards, left: buys, landed: landed };
    ev.push({ t: 'shop', p: pid, cards: cards.slice(), left: buys, landed: landed });
  }
  function openMeeting(s, pid, n, keep, landed, ev) {
    var cards = [];
    for (var i = 0; i < n; i++) cards.push(takeType(s));
    s.ctx.meeting = { cards: cards, keep: keep, landed: landed };
    ev.push({ t: 'meeting', p: pid, cards: cards.slice(), keep: keep, landed: landed });
  }
  function randomCompanyMove(s, pid, kind, ev) {
    var cid = R.int(s, NC), die = 1 + R.int(s, 6), pc = ((kind === 'brief' ? K.briefBase : K.ritualBase) + die) * (kind === 'brief' ? 1 : -1), pct = [];
    for (var i = 0; i < NC; i++) pct.push(i === cid ? pc / 100 : 0);
    ev.push({ t: 'cellfx', p: pid, kind: kind, cid: cid, die: die, pct: pc });
    applyEvent(s, pct, kind, ev);
  }

  function doMove(s, ev) {
    var pid = s.turn, p = s.players[pid];
    var steps = s.ctx.dice.reduce(function (a, b) { return a + b; }, 0), from = p.pos;
    p.pos = (from + steps) % NB;
    var jump = !!s.ctx.jump;
    ev.push({ t: 'move', p: pid, from: from, to: p.pos, steps: steps, jump: jump });
    var se = s.stockEvent;
    if (se && se.left > 0) {
      se.left--;
      var fy = s.quarter >= K.finalYearFrom, lo = fy ? K.finalStepMin : K.stockStepMin, hi = fy ? K.finalStepMax : K.stockStepMax;
      var mag = lo + R.int(s, hi - lo + 1), sp = [];
      for (var q = 0; q < NC; q++) sp.push(q === se.cid ? (se.up ? mag : -mag) / 100 : 0);
      ev.push({ t: 'stockstep', cid: se.cid, up: se.up, pct: se.up ? mag : -mag, left: se.left });
      applyEvent(s, sp, 'stockfx', ev, 1);
    }
    if (from + steps >= NB) settle(s, pid, ev);
    var passedShop = false, passedMeet = false;
    for (var st = 1; st < steps && !jump; st++) {
      var tp = D.board[(from + st) % NB].type;
      if (tp === 'shop') passedShop = true;
      if (tp === 'meeting') passedMeet = true;
    }
    var cell = D.board[p.pos];
    s.phase = 'act';
    ev.push({ t: 'land', p: pid, cell: p.pos });
    s.stats.landings[cell.type] = (s.stats.landings[cell.type] || 0) + 1;
    var i, pct;
    if (passedShop && cell.type !== 'shop') openShop(s, pid, K.shopPass, K.shopPassBuy, false, ev);
    if (passedMeet && cell.type !== 'meeting') openMeeting(s, pid, K.meetPass, K.meetPassKeep, false, ev);
    switch (cell.type) {
      case 'company':
        s.ctx.allow.push({ any: false, cid: cell.cid, left: K.buyCap, mleft: K.mergeCap, src: 'land' });
        if (s.major[cell.cid] === pid) {
          s.phase = 'major';
          s.pending = { major: pid, cid: cell.cid, lander: pid };
          ev.push({ t: 'major_ask', major: pid, cid: cell.cid });
        }
        break;
      case 'broker':
        s.ctx.allow.push({ any: true, cid: -1, mcid: -1, left: K.buyCap, mleft: K.mergeCap, src: 'broker' });
        break;
      case 'card':
        drawCard(s, pid, ev);
        break;
      case 'meeting':
        openMeeting(s, pid, K.meetLand, K.meetLandKeep, true, ev);
        break;
      case 'shop':
        openShop(s, pid, K.shopLand, K.shopLandBuy, true, ev);
        break;
      case 'cb':
        s.ctx.cb = true;
        ev.push({ t: 'cb_ask', p: pid });
        break;
      case 'brief':
      case 'ritual':
        randomCompanyMove(s, pid, cell.type, ev);
        break;
      case 'rest':
        addCash(s, pid, K.restBonus, 'rest', ev);
        break;
      case 'news':
        doNews(s, pid, ev);
        break;
      case 'swan':
        var sw = D.swans[drawFrom(s, 'swanDeck', D.swans.length)];
        var swDelta = Math.round(sw.score * K.swanScoreShare);
        ev.push({ t: 'swan', p: pid, id: sw.id, score: swDelta });
        pct = [];
        for (i = 0; i < NC; i++) pct.push(fxPct(sw, D.companies[i]));
        applyEvent(s, pct, 'swan', ev);
        s.score = clamp(s.score + swDelta, K.scoreMin, K.scoreMax);
        break;
    }
  }

  function doNews(s, pid, ev) {
    var nw = D.news[drawFrom(s, 'newsDeck', D.news.length)];
    var p = s.players[pid], pct = [], i, e = { t: 'news', p: pid, id: nw.id };
    for (i = 0; i < NC; i++) pct.push(0);
    if (nw.kind === 'cash') {
      ev.push(e);
      addCash(s, pid, nw.amt, 'news', ev);
      return;
    }
    if (nw.kind === 'sector') {
      var sec = D.sectors[R.int(s, D.sectors.length)].id;
      e.sector = sec;
      for (i = 0; i < NC; i++) if (D.companies[i].sector === sec) pct[i] = nw.pct / 100;
    } else {
      var best = -1, bv = 0;
      for (i = 0; i < NC; i++) {
        var v;
        if (nw.kind === 'myTop') v = p.holdings[i] * s.prices[i];
        else if (nw.kind === 'cheapest') v = s.fair[i] / s.prices[i];
        else v = s.prices[i] / s.fair[i];
        if (v > bv) { bv = v; best = i; }
      }
      if (best >= 0) { pct[best] = nw.pct / 100; e.cid = best; }
    }
    ev.push(e);
    applyEvent(s, pct, 'news', ev);
  }

  // ---------- 買賣 ----------
  // 內部認股：大股東自己踩到這家公司、而且選了內部認股，這回合買進打折
  function insider(s, pid, cid) {
    return !!(s.ctx && s.turn === pid && s.ctx.insider === cid);
  }
  function buyMult(s, pid, cid) {
    var p = s.players[pid], m = 1;
    if (insider(s, pid, cid)) m = 1 - K.insiderDisc;
    if (s.ctx && s.ctx.treasury && s.turn === pid && s.major[cid] === pid) m = Math.min(m, 1 - K.treasuryDisc);
    if (rules(s).buyDisc) m = Math.min(m, 1 - rules(s).buyDisc);
    void p;
    return m;
  }
  function unitCost(s, pid, cid) { return Math.round(lotValue(s, cid) * buyMult(s, pid, cid)); }
  // 遠端下單不能買自己正站著的那家公司
  function blocked(s, x, cid) {
    if (x.src === 'treasury') return s.major[cid] !== s.turn;
    if (x.src !== 'remote') return false;
    var cell = D.board[s.players[s.turn].pos];
    return cell.type === 'company' && cell.cid === cid;
  }
  // 額度綁定的公司：一般買進看 cid，併購看 mcid（踩格子的額度兩者相同）
  function boundKey(key) { return key === 'mleft' ? 'mcid' : 'cid'; }
  function bound(x, key) { var b = x[boundKey(key)]; return b === undefined ? x.cid : b; }
  function fits(s, x, cid, key) { var b = bound(x, key); return b === cid || (x.any && b === -1 && !blocked(s, x, cid)); }
  function quota(s, cid, key) {
    if (!s.ctx) return 0;
    var a = 0, ok = false;
    for (var i = 0; i < s.ctx.allow.length; i++) {

    try { localStorage.setItem('hongpan-cid', cid); } catch (e) { /* 略過 */ }

  // Claude 的 Artifact 頁面不允許對外連線，只在一般網站上開放

    return m ? m[1].toLowerCase() : '';

  function link(room) { return g.location.origin + g.location.pathname + '?room=' + room; }

    var a = 'abcdefghjkmnpqrstuvwxyz23456789', s = '';

      var nx = dz, nz = -dx;
      var mx = verts[k].x + dx * L[k] * 0.5, mz = verts[k].z + dz * L[k] * 0.5;
      if (mx * nx + mz * nz < 0) { nx = -nx; nz = -nz; }
      var vl = Math.sqrt(verts[k].x * verts[k].x + verts[k].z * verts[k].z);
      cells.push({ corner: true, x: verts[k].x, z: verts[k].z, ang: a, nx: verts[k].x / vl, nz: verts[k].z / vl, dx: -verts[k].z / vl, dz: verts[k].x / vl });

    if ((c = handCard(p, 'pick'))) {

      for (var k = 1; k <= 6; k++) out += '<button class="btn small gold" data-act="play" data-uid="' + c.uid + '" data-steps="' + k + '" title="走到「' + cellName((p.pos + k) % D.board.length) + '」">' + k + '</button>';
      out += '</span>';
    }
    return out || '<span class="muted">想走近一點時用</span>';
  }
  function cellName(i) { var c = D.board[i]; return c.type === 'company' ? cname(c.cid) : c.name; }
  function shopHtml(s, me) {
    var sh = s.ctx && s.ctx.shop;
    if (ui.shopDone || !sh || sh.left <= 0 || !sh.cards.some(function (c) { return c; })) return '';
    var cash = s.players[me].cash;
    return '<div class="ctx-title">卡片交易所 <small>' + (sh.landed ? '停留' : '經過') + '・還能買 ' + sh.left + ' 張・每張 ' + wan(K.shopPrice) + '</small></div><div class="offer">' + sh.cards.map(function (type, i) {
      if (!type) return '<div class="offer-card sold"><b>已買</b></div>';
      return '<button class="offer-card cat-' + D.cards[type].cat + '" data-act="shopbuy" data-i="' + i + '"' + (cash < K.shopPrice ? ' disabled' : '') + ' title="' + D.cards[type].text + '"><b>' + cardName(type) + '</b><small>' + D.CAT_NAMES[D.cards[type].cat] + '</small><span>' + D.cards[type].text + '</span><em>買</em></button>';
    }).join('') + '</div>';
  }
  function renderPanel() {
    if (!game) return;
    var s = game.state, me = myTurn(), ctx = '', main = { label: '請稍候', act: '', dis: true };
    var cur = s.phase === 'over' ? -1 : E.actor(s);
    if (s.phase === 'over') {
      ctx = '<div class="ctx-title">五年結束</div><div class="ctx-text">最後總資產最高的人獲勝。</div>';
      main = { label: '看結算', act: 'results', dis: false };
    } else if (me < 0) {
      var p = s.players[cur];
      ctx = '<div class="ctx-title">' + (p.kind === 'ai' || isLocal(cur) ? esc(p.name) + ' 行動中' : '等 ' + esc(p.name) + ' 操作') + ' <small>' + (p.kind === 'ai' ? '電腦・' + (AI.LABELS[p.style] || '') : isLocal(cur) ? '' : '線上玩家') + '</small></div><div class="ctx-text">可以趁這時候看看市場和自己的手牌。</div>';
    } else if (s.phase === 'pre') {
      ctx = '<div class="ctx-title">' + pname(me) + ' 的回合 <small>現金 ' + wan(s.players[me].cash) + '</small></div>';
      var fc0 = focusCompany(s);
      if (fc0 >= 0) ctx += companyLine(fc0) + tradeHtml(fc0, me) + otherPick(s);
      else if (anyAllowance(s)) ctx += '<div class="ctx-text">遠端下單生效中：可以買進任一家公司最多 ' + K.remoteCap + ' 張（不含你站著的那家，不能併購）。</div><div class="trade"><button class="btn small" data-act="pickstock">選一家公司</button></div>';
        else ctx += '<div class="ctx-text">擲骰前可以先賣股票或出策略卡。</div>';
      ctx += '<div class="trade"><button class="btn small" data-act="roll1">只擲一顆骰子</button>' + quickCards(s, me) + '</div>';
      main = { label: '擲兩顆骰子', act: 'roll', dis: false };
    } else if (s.phase === 'rolled') {
      var d = s.ctx.dice.filter(function (x) { return x; }), sum = d.reduce(function (a, b) { return a + b; }, 0), to = (s.players[me].pos + sum) % D.board.length, cell = D.board[to];
      ctx = '<div class="ctx-title">擲出 ' + d.join(' ＋ ') + '</div><div class="ctx-text">會走到「<b>' + (cell.type === 'company' ? cname(cell.cid) : cell.name) + '</b>」。你手上有「加班趕路」，不滿意可以重擲一次。</div>' +
        '<div class="trade"><button class="btn small gold" data-act="reroll">用「加班趕路」重擲</button></div>';
      main = { label: '前進 ' + sum + ' 步', act: 'move', dis: false };
    } else if (s.phase === 'major') {
      ctx = '<div class="ctx-title">等待大股東決定</div>';
    } else if (s.phase === 'act' && (s.ctx.meeting || s.ctx.cb)) {
      if (s.ctx.meeting) {
        var mt = s.ctx.meeting;
        ctx = '<div class="ctx-title">策略會議 <small>' + (mt.landed ? '停留' : '經過') + '・' + mt.cards.length + ' 張裡還要選 ' + mt.keep + ' 張</small></div><div class="offer">' + mt.cards.map(function (type, i) {
          if (!type) return '<div class="offer-card sold"><b>已留下</b></div>';
          return '<button class="offer-card cat-' + D.cards[type].cat + '" data-act="meet" data-i="' + i + '"><b>' + cardName(type) + '</b><small>' + D.CAT_NAMES[D.cards[type].cat] + '</small><span>' + D.cards[type].text + '</span><em>留這張</em></button>';
        }).join('') + '</div>';
      } else {
        var sc = s.score, up = Math.min(K.scoreMax, sc + K.cbStep), dn = Math.max(K.scoreMin, sc - K.cbStep);
        ctx = '<div class="ctx-title">央行 <small>景氣分數 ' + sc + '（' + REGIME_TEXT[s.regime] + '）</small></div><div class="ctx-text">' + K.scoreBull + ' 分以上多頭、' + K.scoreBear + ' 分以下空頭。改完馬上影響這一季的燈號。</div>' +
          '<div class="trade"><button class="btn grow" data-act="cbdir" data-dir="1">降息：' + sc + ' → ' + up + '（' + REGIME_TEXT[E.regimeOf(up)] + '）</button><button class="btn grow" data-act="cbdir" data-dir="-1">升息：' + sc + ' → ' + dn + '（' + REGIME_TEXT[E.regimeOf(dn)] + '）</button></div>';
      }
      main = { label: '請先完成決定', act: '', dis: true };
    } else if (s.phase === 'act') {
      var here = D.board[s.players[me].pos], fc = focusCompany(s);
      if (fc >= 0) {
        ctx = companyLine(fc) + tradeHtml(fc, me);
        if (!canTrade(s, fc)) ctx += '<div class="ctx-text">這回合已經買滿。</div>';
        ctx += otherPick(s);
      } else if (anyAllowance(s)) {
        ctx = '<div class="ctx-title">' + (here.type === 'broker' ? '證券交易所' : '遠端下單') + '</div><div class="ctx-text">可以買進任一家公司（' + (here.type === 'broker' ? '最多 ' + K.buyCap : '遠端最多 ' + K.remoteCap) + ' 張）' + (here.type === 'broker' ? '，也可以向對手併購最多 ' + K.mergeCap + ' 張' : '，遠端下單不能併購') + '。</div><div class="trade"><button class="btn small" data-act="pickstock">選一家公司</button></div>';
      } else if (here.type === 'company') {
        ctx = companyLine(here.cid) + '<div class="ctx-text">這回合已經買滿，或已經買過了。</div>';
      } else {
        ctx = '<div class="ctx-title">' + here.name + '</div><div class="ctx-text">' + CELL_TEXT[here.type] + '</div>';
      }
      ctx = shopHtml(s, me) + ctx;
      if (s.players[me].hand.length > K.handMax) ctx += '<div class="ctx-text up">手牌超過 ' + K.handMax + ' 張，要先出卡或棄卡才能結束回合。</div>';
      main = { label: '結束回合', act: 'end', dis: false };
    }
    $('ctx').innerHTML = ctx;
    var hand = ui.me >= 0 ? s.players[ui.me].hand.length : 0;
    $('acts').innerHTML = '<button class="btn" data-act="market">市場</button>' +
      '<button class="btn" data-act="hand"' + (ui.me < 0 ? ' disabled' : '') + '>手牌 <span class="n">' + hand + '</span></button>' +
      '<button class="btn" data-act="log">紀錄</button>' +
      '<button class="btn primary" id="mainBtn" data-act="' + main.act + '"' + (main.dis ? ' disabled' : '') + '>' + main.label + '</button>';
  }

  // ---------- 抽屜 ----------
  function sheetWrap(title, body) {
    return '<div class="overlay" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>' + title + '</h2><button class="x" data-act="close" aria-label="關閉">✕</button></div><div class="sheet-body">' + body + '</div></div></div>';
  }
  function renderSheet() {
    var sh = ui.sheet, el = $('sheetLayer');
    if (!sh) { el.innerHTML = ''; return; }
    var keep = el.querySelector('.sheet-body'), top = keep && el.dataset.type === sh.type ? keep.scrollTop : 0;
    var html = '';
    if (sh.type === 'market') html = marketSheet(sh);
    else if (sh.type === 'stock') html = stockSheet(sh.cid);
    else if (sh.type === 'hand') html = handSheet();
    else if (sh.type === 'player') html = playerSheet(sh.pid);
    else if (sh.type === 'log') html = logSheet();
    else if (sh.type === 'help') html = helpSheet();
    else if (sh.type === 'results') html = resultsSheet();
    el.innerHTML = html;
    el.dataset.type = sh.type;
    var body = el.querySelector('.sheet-body');
    if (body) body.scrollTop = sh.type === 'log' && !top ? body.scrollHeight : top;
  }
  function openSheet(sh) { ui.sheet = sh; ui.playing = null; renderSheet(); }

  function stockBox(s) {
    var se = s.stockEvent;
    if (!se || se.left <= 0) return '';
    return '<div class="regime-box ' + (se.up ? 'bull' : 'bear') + '"><b>' + cname(se.cid) + (se.up ? ' 接到大單' : ' 財報爆雷') + '</b>：還會' + (se.up ? '上漲' : '下跌') + ' ' + se.left + ' 次，每次' + (s.quarter >= K.finalYearFrom ? ' 8%～10%' : ' 5%～7%') + '（每位玩家移動時）</div>';
  }
  function forecastBox(s) {
    if (!s.forecast) return '<div class="regime-box"><b>這是最後一季</b>，沒有下季預告。</div>';
    return '<div class="regime-box fcbox"><b>下季預告</b>（兩個裡面會發生一個，各半機率）' + (D.macroMult(s.quarter + 1) > 1 ? '<b class="up">封關年：影響加倍</b>' : '') + s.forecast.map(function (id) {
      var m = D.macro[id];
      return '<div><b>' + esc(m.name) + '</b>：' + (fxText(fxList(m, D.macroMult(s.quarter + 1))) || '無影響') + '<span class="muted">・景氣分數 ' + (m.score * (K.scoreScale || 1) >= 0 ? '+' : '−') + Math.abs(m.score * (K.scoreScale || 1)) + '</span></div>';
    }).join('') + '</div>';
  }
  function regimeBox(s) {
    var r = K.regimeRules[s.regime];
    return '<div class="regime-box ' + s.regime + '"><b>' + REGIME_TEXT[s.regime] + '季</b>' + (s.flipped ? '（景氣轉向）' : '') + '　景氣分數 <b class="num">' + s.score + '</b>（' + K.scoreBull + ' 分以上多頭、' + K.scoreBear + ' 分以下空頭）<br>' +
      '一般買進' + (r.buyDisc ? '打 ' + Math.round((1 - r.buyDisc) * 100) / 10 + ' 折' : '原價') + '・併購溢價 ' + Math.round(r.premium * 100) + '%・賣出' + (r.sellFee ? '交易成本 ' + Math.round(r.sellFee * 100) + '%' : '免交易成本') + '<br><b>季末全市場 ' + (K.regimeDrift[s.regime] > 0 ? '+' : K.regimeDrift[s.regime] < 0 ? '−' : '') + Math.round(Math.abs(K.regimeDrift[s.regime]) * 100) + '%</b>・現金年利率 ' + Math.round(K.cashRateQ[s.regime] * 400) + '%（以季末當下的燈號計算）</div>' + stockBox(s) + forecastBox(s);
  }
  // 這檔股票誰持有幾張：大股東標 ★，自己的張數在右邊那欄，這裡只列對手
  function holdersHtml(s, cid, who) {
    var mj = s.major[cid], list = [];
    s.players.forEach(function (q, i) { if (i !== who && q.holdings[cid] > 0) list.push(i); });
    list.sort(function (a, b) { return s.players[b].holdings[cid] - s.players[a].holdings[cid]; });
    var h = mj >= 0 && mj === who ? '大股東 你' + (E.locked(s, who, cid) ? '🔒' : '') : '';
    if (list.length) h += (h ? '・' : '') + list.map(function (i) {
      return '<span class="hd' + (i === mj ? ' mj' : '') + '" title="' + esc(s.players[i].name) + ' ' + s.players[i].holdings[cid] + ' 張' + (i === mj ? '（大股東）' : '') + '"><i class="tdot" style="background:' + COLORS[i] + '"></i>' + esc(s.players[i].name) + ' ' + s.players[i].holdings[cid] + (i === mj ? '★' : '') + (E.locked(s, i, cid) ? '🔒' : '') + '</span>';
    }).join('');
    return h ? '<small class="holders">' + h + '</small>' : '';
  }
  function marketSheet(sh) {
    var s = game.state, who = ui.me >= 0 ? ui.me : -1, html = '';
    if (sh.pick) html += '<p class="muted">選一家要買的公司。</p>';
    html += regimeBox(s);
    html += '<div class="stock-cols"><span>公司</span><span>股價</span><span>本季</span><span>持股</span></div>';
    D.sectors.forEach(function (sec) {
      var tr = s.trend[sec.id] || 0;
      html += '<div class="sec-head"><i style="background:' + sec.color + '"></i>' + sec.name + (tr ? ' <span>題材餘溫：下季約 ' + (tr > 0 ? '+' : '−') + Math.abs(tr * 100).toFixed(1) + '%</span>' : '') + '</div>';
      D.companies.forEach(function (c) {
        if (c.sector !== sec.id) return;
        var t = E.tag(s, c.id), own = who >= 0 ? s.players[who].holdings[c.id] : 0, k = cls(s.prevClose[c.id], s.prices[c.id]);
        html += '<button class="stock" data-act="stock" data-cid="' + c.id + '"><span class="nm">' + c.name + ' <span class="tag ' + t + '">' + TAG_TEXT[t] + '</span>' + holdersHtml(s, c.id, who) + '</span>' +
          '<span class="r ' + k + '">' + px(s.prices[c.id]) + '</span><span class="r ' + k + '">' + pctStr(s.prevClose[c.id], s.prices[c.id]) + '</span><span class="own">' + (own ? '<b>' + own + '</b> 張' : '—') + '</span></button>';
      });
    });
    return sheetWrap(sh.pick ? '選股票' : '市場行情', html);
  }

  function stockSheet(cid) {
    var s = game.state, c = D.companies[cid], t = E.tag(s, cid), me = myTurn(), who = ui.me;
    var k = cls(s.prevClose[cid], s.prices[cid]), yld = (c.div / (s.prices[cid] * 100)) * 100;
    var html = '<div class="kv" style="margin-bottom:8px">' + secTag(c.sector) + ' <span class="tag ' + t + '">' + TAG_TEXT[t] + '</span><span>' + c.role + '</span></div>' +
      '<div class="facts"><div>股價<b class="' + k + '">' + px(s.prices[cid]) + ' 元</b></div><div>本季漲跌<b class="' + k + '">' + pctStr(s.prevClose[cid], s.prices[cid]) + '</b></div>' +
      '<div>一張要<b>' + wan(E.lotValue(s, cid)) + '</b></div><div>波動<b>' + VOL_TEXT[c.vol] + '</b></div>' +
      '<div>每張股息<b>' + c.div.toLocaleString('en-US') + ' 元</b></div><div>殖利率約<b>' + yld.toFixed(1) + '%</b></div></div>';
    var holders = s.players.map(function (p, i) { return p.holdings[cid] ? '<span>' + dot(i) + esc(p.name) + ' <b class="num">' + p.holdings[cid] + '</b> 張' + (s.major[cid] === i ? '（大股東）' : '') + '</span>' : ''; }).join('');
    html += '<div class="block"><h3>誰持有</h3><div class="holders">' + (holders || '<span class="muted">目前沒有人持有。至少 3 張且最多的人會成為大股東。</span>') + '</div>' + (holders && s.major[cid] < 0 ? '<div class="muted">目前沒有大股東' + noMajorWhy(cid) + '</div>' : '') + '</div>';
    if (who >= 0 && s.players[who].holdings[cid]) {
      var have = s.players[who].holdings[cid], cost = s.players[who].costBasis[cid], val = have * E.lotValue(s, cid);
      html += '<div class="block"><h3>' + pname(who) + ' 的持股</h3><div class="kv"><span>持有 <b>' + have + '</b> 張</span><span>市值 <b>' + wan(val) + '</b></span><span>損益 <b class="' + cls(cost, val) + '">' + signed(val - cost) + '</b></span></div>' +
        (me === who && (s.phase === 'pre' || s.phase === 'act') ? sellHtml(cid, me) + '<div class="muted">' + (E.sellFee(s) ? '賣出會扣 ' + Math.round(E.sellFee(s) * 100) + '% 交易成本。' : '多頭季賣出免交易成本。') + '</div>' : '<div class="muted">輪到你的時候才能賣出。</div>') + '</div>';
    }
    if (me >= 0 && (s.phase === 'pre' || s.phase === 'act') && canTrade(s, cid)) html += '<div class="block"><h3>買進／併購</h3>' + tradeHtml(cid, me) + '</div>';
    else html += '<div class="block"><div class="muted">踩到這家公司的格子（或證券交易所）才能買進。</div></div>';
    return sheetWrap(c.name, html);
  }

  var WHEN_TEXT = { pre: '擲骰前才能用', rolled: '擲骰後、移動前才能用', act: '移動後、站在公司格上才能用', turn: '輪到你時可以用' };
  function whyNot(s, me, type) {
    var def = D.cards[type], cell = D.board[s.players[me].pos];
    if (type === 'treasury' && !s.major.some(function (m) { return m === me; })) return '你要先當上某家公司的大股東';
    if (type === 'flip' && s.regime === 'flat') return '盤整季不能用';
    if (type === 'lock') return s.major.some(function (m) { return m === me; }) ? '你當大股東的公司都已經鎖定了' : '你要先當上某家公司的大股東';
    if ((type === 'bull' || type === 'bear') && s.phase === 'act' && cell.type === 'company') return '這個產業這一季已經被卡片影響過';
    return WHEN_TEXT[def.when];
  }
  function handSheet() {
    var s = game.state, who = ui.me, p = s.players[who], me = myTurn() === who, html = '';
    var turn = me && (s.phase === 'pre' || s.phase === 'act');
    html += '<div class="sec-head">手牌 <span>' + p.hand.length + ' / ' + K.handMax + ' 張・行動卡管自己、對抗卡針對對手、中立卡影響所有人</span></div>';
    if (!p.hand.length) html += '<p class="muted">手上沒有卡。經過結算站、策略會議，或在卡片交易所買卡都能拿到。</p>';
    p.hand.forEach(function (c) {
      var def = D.cards[c.type], acts = '', ok = me && E.canPlay(s, who, c.type);
      if (ok && def.need === 'steps') {
        acts = '<span class="muted">走幾步：</span>';
        for (var k = 1; k <= 6; k++) acts += '<button class="btn small gold" data-act="play" data-uid="' + c.uid + '" data-steps="' + k + '" title="' + cellName((p.pos + k) % D.board.length) + '">' + k + '</button>';
      } else if (ok && def.need === 'company') {
        acts = '<span class="muted">鎖哪家：</span>' + E.lockable(s, who).map(function (ci) { return '<button class="btn small gold" data-act="play" data-uid="' + c.uid + '" data-cid="' + ci + '">' + cname(ci) + ' ' + p.holdings[ci] + ' 張</button>'; }).join('');
      } else if (ok && def.need === 'target') {
        acts = '<span class="muted">對誰：</span>' + s.players.map(function (q, i) { return i === who ? '' : '<button class="btn small gold" data-act="play" data-uid="' + c.uid + '" data-target="' + i + '"><i class="tdot" style="background:' + COLORS[i] + ';width:10px;height:10px;margin-right:2px"></i>' + esc(q.name) + (q.audits ? '（已被查 ' + q.audits + ' 次）' : '') + '</button>'; }).join('');
      } else if (ok) {
        acts = '<button class="btn small gold" data-act="play" data-uid="' + c.uid + '">出牌</button>';
      } else acts = '<span class="muted">' + (me ? whyNot(s, who, c.type) : '輪到你時才能出牌') + '</span>';
      if (turn) acts += ' <button class="btn small" data-act="discard" data-uid="' + c.uid + '">棄掉</button>';
      html += '<div class="card cat-' + def.cat + '"><div class="card-top"><b>' + def.name + '</b><small class="cat">' + D.CAT_NAMES[def.cat] + '</small></div><p>' + def.text + '</p><div class="card-acts">' + acts + '</div></div>';
    });
    return sheetWrap(pname(who) + ' 的策略卡', html);
  }

  function yuan(n) { return wan1(n); }
  // 依目前持股與股價，預估年底會領到的錢（策略卡加碼另計）
  function expected(s, pid, cid) {
    var p = s.players[pid], n = p.holdings[cid];
    return { div: n * D.companies[cid].div, major: s.major[cid] === pid ? Math.round(n * E.lotValue(s, cid) * K.majorYield) : 0 };
  }
  function playerSheet(pid) {
    var s = game.state, p = s.players[pid], hv = E.holdingsValue(s, pid), html = '';

        }).join('') + '</div><div class="card-acts"><button class="btn grow" data-act="modal" data-i="' + cards.length + '">' + (picks.length ? '買好了' : '不買') + '</button></div>';
      var vals = cards.map(function (x, i) { return { value: i }; });

      return showCard({ kicker: '卡片交易所', title: '要買哪一張？', html: html, custom: true, buttons: vals }).then(function (i) {

  function pickMeeting(mt) {
    var cards = mt.cards.slice(), picks = [], need = mt.keep;
    function one() {
      if (picks.length >= need) return Promise.resolve(picks);
      var html = '<div class="ctx-text">' + (mt.landed ? '停在' : '經過') + '策略會議：' + cards.length + ' 張裡選 ' + need + ' 張留下' + (need > 1 ? '（還要選 ' + (need - picks.length) + ' 張）' : '') + '。</div><div class="offer modal-offer">' +
        cards.map(function (type, i) {
          if (picks.indexOf(i) >= 0) return '<div class="offer-card sold"><b>已留下</b><small>' + cardName(type) + '</small></div>';
          return '<button class="offer-card cat-' + D.cards[type].cat + '" data-act="modal" data-i="' + i + '"><b>' + cardName(type) + '</b><small>' + D.CAT_NAMES[D.cards[type].cat] + '</small><span>' + D.cards[type].text + '</span><em>留這張</em></button>';
        }).join('') + '</div>';
      return showCard({ kicker: '策略會議', title: '選一張留下', html: html, custom: true, buttons: cards.map(function (x, i) { return { value: i }; }) })
        .then(function (i) { if (i !== null && picks.indexOf(i) < 0) picks.push(i); return one(); });
    }
    return one();
  }

  function save() {

  function loadSave() {
    try { var d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return d && d.config && d.cmds ? d : null; } catch (err) { return null; }

  // 線上對戰：別人的指令先放進信箱，等這邊動畫播完、輪到那個人時再套用
  function pump() {

  function dispatch(cmd, remote) {

    if (!r.ok) { toast(remote ? '和其他人的牌局不同步了，請重新整理頁面' : esc(r.error), 'err'); return; }
    game.cmds.push(cmd);
    if (game.net && !remote && game.state.players[cmd.player].kind === 'human') RL.net.sendCmd(game.cmds.length - 1, cmd);

  function step() {
    var s = game.state, token = game;
    if (s.phase === 'over') {

      return;
    }
    if (!isLocal(a)) {
      ui.busy = false;

      return;
    }
    ui.busy = false;
    if (s.phase === 'major') {

        title: '你踩到自己的「' + cname(pd.cid) + '」',
        html: '<div class="ctx-text">你持有 ' + have + ' 張，市值 ' + wan(have * lot) + '。二選一：<br><b>內部認股</b>：這回合買這家打八五折，一張 ' + wan(Math.round(lot * (1 - K.insiderDisc))) + '（原價 ' + wan(lot) + '）。<br><b>拉抬股價</b>：擲一顆骰，股價上漲 ' + (K.pumpBase + 1) + '%～' + (K.pumpBase + 6) + '%，你的持股約多 ' + wan(Math.round(have * lot * (K.pumpBase + 1) / 100)) + '～' + wan(Math.round(have * lot * (K.pumpBase + 6) / 100)) + '。</div>',
        buttons: [{ label: '內部認股', value: 'insider', cls: 'gold' }, { label: '拉抬股價', value: 'pump' }]
      }).then(function (v) { if (token === game) dispatch({ type: 'MAJOR_CHOICE', player: a, choice: v }); });
      return;

    ui.me = a;

  function startGame(config, seed, cmds, net) {
    var gme = E.createGame(config, seed);
    game = { config: config, seed: String(seed), state: gme.state, cmds: [], net: net || null, inbox: {} };
    ui.waiting = false;
    ui.log = []; ui.sheet = null; ui.playing = null; ui.focusCid = -1; ui.lastHuman = -1;

    var events = gme.events;
    if (cmds && cmds.length) {
      for (var i = 0; i < cmds.length; i++) {
        var r = E.applyCommand(game.state, cmds[i]);

        game.cmds.push(cmds[i]);
      }
      events = null;

  // ---------- 線上房間 ----------
  var lobbyState = null; // {mode:'host'|'guest'|'join', room, msg, status, seats, seed}
  function netHandlers() {
    return {
      ready: function () { if (lobbyState) { lobbyState.ready = true; if (!game || $('setup').hidden === false) renderLobbyIfOpen(); } },
      lobby: function (m) {
        if (!lobbyState) return;
        var reopened = lobbyState.msg && lobbyState.msg.started && !m.started && game && game.net && game.state.phase === 'over';
        lobbyState.msg = m;
        if (m.you >= 0) lobbyState.status = '';
        if (reopened && $('setup').hidden) toast('房主回到房間了，按「回到房間」就能一起開下一局');
        renderLobbyIfOpen();
      },
      status: function (s) { if (lobbyState && !$('setup').hidden) { lobbyState.status = s; renderLobby(); } else toast(esc(s)); },
      full: function (m) { if (lobbyState) { lobbyState.status = m.started ? '這個房間已經開打，沒有你的座位。' : '房間滿了。'; lobbyState.dead = true; renderLobby(); } },
      cmds: function () { return game ? game.cmds : []; },
      cmd: function (n, cmd) { if (game && game.net && n >= game.cmds.length) { game.inbox[n] = cmd; pump(); } },
      start: function (m) {
        if (game && game.net && game.seed === String(m.seed)) {
          // 斷線重連：補上漏掉的指令，並把對方沒收到的自己指令重送
          var i;
          for (i = m.cmds.length; i < game.cmds.length; i++) RL.net.sendCmd(i, game.cmds[i]);
          for (i = game.cmds.length; i < m.cmds.length; i++) game.inbox[i] = m.cmds[i];
          pump();
          return;
        }
        try { startGame(m.config, m.seed, m.cmds, { room: RL.net.room, role: 'guest' }); } catch (err) { toast('牌局資料讀取失敗，請重新整理', 'err'); }
      }
    };
  }
  function renderLobbyIfOpen() { if (!$('setup').hidden) renderLobby(); }
  function renderLobby() {
    var L = lobbyState, html = '<div class="setup-card"><div class="brand"><h1>紅盤環線</h1><p>線上房間</p></div>';
    if (L.mode === 'join') {
      html += '<p class="lede">朋友邀你一起玩。輸入你的名字後加入房間。</p><label class="seed"><span>名字</span><input id="joinName" maxlength="8" value="' + esc(L.name || '') + '" placeholder="最多 8 個字"></label>' +
        '<div class="setup-acts"><button class="btn primary grow" data-act="join">加入房間</button><button class="btn" data-act="help">規則</button></div>';
    } else {

        var hs = L.seats ? L.seats.filter(function (x) { return x.kind === 'human'; })[0] : null;
        if (hs && !game) html += '<label class="seed"><span>你的名字</span><input id="hostName" maxlength="8" value="' + esc(hs.name) + '"></label>';
        if (!L.ready) html += '<p class="muted">正在開房間…</p>';
      } else if (!L.dead) html += '<p class="lede">' + (m ? (m.started ? '上一局結束了，等房主回到房間開下一局。' : '已加入房間，等房主按開始。') : '正在連到房間…') + '</p>';

        html += '<div class="seatrow"><i style="background:' + COLORS[i] + '"></i><b>' + esc(s.kind === 'online' && !s.taken ? '空位' : s.name) + (m.you === i ? '（你）' : '') + '</b><span class="' + (s.kind === 'online' && !s.taken ? 'wait' : '') + '">' + who + '</span></div>';
      });

        html += '<div class="setup-acts"><button class="btn primary grow" data-act="netstart"' + (open || !L.ready ? ' disabled' : '') + '>' + (open ? '還有 ' + open + ' 個空位' : '開始遊戲') + '</button><button class="btn" data-act="netcancel">取消</button></div>';

  function openLobby() {
    readSetup();
    var st = ui.setup, used = {}, seats = [];
    for (var i = 0; i < st.n; i++) {
      var p = st.players[i], isAi = p.kind !== 'human' && p.kind !== 'online';
      var name = p.kind === 'online' ? '朋友' : (p.name || '').trim() || (isAi ? AI.NAMES[p.kind] : '玩家 ' + (i + 1));
      if (p.kind === 'human' && name === '你') name = '房主';
      if (p.kind !== 'online') { var base = name, k = 2; while (used[name]) name = base + k++; used[name] = 1; }
      seats.push({ name: name, kind: isAi ? 'ai' : p.kind, style: isAi ? p.kind : null, cid: null });
    }
    lobbyState = { mode: 'host', room: RL.net.newRoom(), seats: seats, seed: (st.seed || '').trim(), cash: st.cash, msg: null, status: '', ready: false };
    lobbyState.msg = { seats: seats.map(function (s) { return { name: s.name, kind: s.kind, style: s.style, taken: s.kind !== 'online', on: s.kind !== 'online' }; }), you: -1 };

      while (used[name]) name = base + k++;
      used[name] = 1;

    });
    var seed = L.seed || Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36), config = { players: players, startCash: (L.cash || 100) * 10000 };

  function resumeHost(sv) {

    });
